<body class="bg-[#041012] text-[#F3FEFF] selection:bg-[#06B6D4] selection:text-[#041012]">

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    const DAFTAR_BULAN = [
      "Januari", "Februari", "Maret", "April", "Mei", "Juni",
      "Juli", "Agustus", "September", "Oktober", "November", "Desember"
    ];

    /* Palet warna lembut untuk pembeda tiap bulan */
    const WARNA_BULAN = {
      "Januari":   { bg: "bg-emerald-500/15", text: "text-emerald-300", border: "border-emerald-500/30" },
      "Februari":  { bg: "bg-sky-500/15",     text: "text-sky-300",     border: "border-sky-500/30" },
      "Maret":     { bg: "bg-indigo-500/15",  text: "text-indigo-300",  border: "border-indigo-500/30" },
      "April":     { bg: "bg-teal-500/15",    text: "text-teal-300",    border: "border-teal-500/30" },
      "Mei":       { bg: "bg-rose-500/15",    text: "text-rose-300",    border: "border-rose-500/30" },
      "Juni":      { bg: "bg-amber-500/15",   text: "text-amber-300",   border: "border-amber-500/30" },
      "Juli":      { bg: "bg-violet-500/15",  text: "text-violet-300",  border: "border-violet-500/30" },
      "Agustus":   { bg: "bg-cyan-500/15",    text: "text-cyan-300",    border: "border-cyan-500/30" },
      "September": { bg: "bg-lime-500/15",    text: "text-lime-300",    border: "border-lime-500/30" },
      "Oktober":   { bg: "bg-orange-500/15",  text: "text-orange-300",  border: "border-orange-500/30" },
      "November":  { bg: "bg-fuchsia-500/15", text: "text-fuchsia-300", border: "border-fuchsia-500/30" },
      "Desember":  { bg: "bg-slate-400/15",   text: "text-slate-300",   border: "border-slate-400/30" }
    };

    function getWarnaBulan(bulan) {
      return WARNA_BULAN[bulan] || { bg: "bg-[#10282C]", text: "text-[#A3E635]", border: "border-[#06B6D4]/20" };
    }

    const STORAGE_KEY = "sdn137_bosp_records_v3";
    const STORAGE_YEAR_KEY = "sdn137_bosp_year";
    const STORAGE_SELECTED_MONTHS_KEY = "sdn137_bosp_selected_months";
    const STORAGE_COL_WIDTHS_KEY = "sdn137_bosp_col_widths";
    const STORAGE_GAS_URL_KEY = "sdn137_bosp_gas_url";
    const STORAGE_TOKO_KEY = "sdn137_bosp_daftar_toko";
    const ADMIN_PIN = "977977";

    const DAFTAR_TOKO_DUMMY = [
      "CV. Media Sarana Edukasi",
      "Toko Buku & ATK Barokah",
      "PT. Pesona Edukasi Mandiri",
      "CV. Citra Karya Mandiri",
      "SIPLah Blibli - Toko SDN 137 Cijerokaso"
    ];

    function filterBukanDummy(nama) {
      if (!nama || typeof nama !== "string") return false;
      const bersih = nama.trim().toLowerCase();
      if (!bersih) return false;
      return !DAFTAR_TOKO_DUMMY.some(d => d.toLowerCase() === bersih);
    }

    /* URL Google Apps Script SDN 137 Cijerokaso */
    const PERMANENT_GAS_URL = "https://script.google.com/macros/s/AKfycbwiDh8rG71QgoKHTJsYXHHEcHTE3LhJdRKg6m9PY4h46UIW-uLKrvWDAf7-YVvOcJML2w/exec";

    const KODE_GOOGLE_APPS_SCRIPT = `/**
 * ==============================================================================
 * SCRIPT INTEGRASI SPREADSHEET BOSP SDN 137 CIJEROKASO (PER-BULAN PER-SHEET)
 * File: Code.gs
 * ==============================================================================
 */
var SPREADSHEET_ID = "";

function getTargetSpreadsheet() {
  if (SPREADSHEET_ID && SPREADSHEET_ID.trim() !== "") {
    return SpreadsheetApp.openById(SPREADSHEET_ID.trim());
  }
  return SpreadsheetApp.getActiveSpreadsheet();
}

function doGet(e) {
  try {
    var ss = getTargetSpreadsheet();
    if (e && e.parameter && e.parameter.action === "ping") {
      return ContentService.createTextOutput(JSON.stringify({
        status: "success",
        message: "Koneksi berhasil! Terhubung dengan Spreadsheet: \\"" + ss.getName() + "\\"",
        spreadsheetName: ss.getName(),
        spreadsheetId: ss.getId(),
        timestamp: new Date().toISOString()
      })).setMimeType(ContentService.MimeType.JSON);
    }

    var daftarToko = [];
    var tokoSheet = ss.getSheetByName("DAFTAR_TOKO");
    if (tokoSheet && tokoSheet.getLastRow() >= 2) {
      var tokoVals = tokoSheet.getRange(2, 1, tokoSheet.getLastRow() - 1, Math.min(3, tokoSheet.getLastColumn())).getValues();
      tokoVals.forEach(function(r) {
        var val = String(r[1] || r[0] || "").trim();
        if (val && val !== "No" && val !== "Nama Toko SIPLah / Rekan" && !/^\\d+$/.test(val)) {
          if (daftarToko.indexOf(val) === -1) {
            daftarToko.push(val);
          }
        }
      });
    }

    // 1. Baca data dari CONFIG_BOSP multi-chunk
    var configSheet = ss.getSheetByName("CONFIG_BOSP");
    if (configSheet && configSheet.getLastRow() >= 2) {
      var totalChunks = Number(configSheet.getRange(1, 1).getValue()) || 1;
      var rawJson = "";
      for (var c = 0; c < totalChunks; c++) {
        rawJson += String(configSheet.getRange(c + 2, 1).getValue() || "");
      }
      if (rawJson && rawJson.charAt(0) === "{") {
        try {
          var parsed = JSON.parse(rawJson);
          if (parsed) {
            if (daftarToko.length > 0) parsed.daftarToko = daftarToko;
            return ContentService.createTextOutput(JSON.stringify({
              status: "success",
              source: "config_backup",
              payload: parsed,
              daftarToko: daftarToko
            })).setMimeType(ContentService.MimeType.JSON);
          }
        } catch(errJson) {}
      }
    }

    // 2. Fallback baca baris dari DATA_BOSP jika CONFIG_BOSP belum ada
    var dataSheet = ss.getSheetByName("DATA_BOSP");
    if (!dataSheet || dataSheet.getLastRow() < 2) {
      return ContentService.createTextOutput(JSON.stringify({
        status: "success",
        source: "empty",
        items: [],
        daftarToko: daftarToko
      })).setMimeType(ContentService.MimeType.JSON);
    }

    var values = dataSheet.getRange(2, 1, dataSheet.getLastRow() - 1, dataSheet.getLastColumn()).getValues();
    var items = values.map(function(r) {
      var tokoVal = String(r[14] || "").trim();
      // Cegah nilai selisih / nominal angka keliru masuk ke nama toko
      if (/^-?\d+([.,]\d+)?$/.test(tokoVal.replace(/\s/g, ''))) {
        tokoVal = "";
      }
      return {
        id: String(r[0] || ""),
        tahun: Number(r[1]) || 2026,
        bulan: String(r[2] || ""),
        kodeRekening: String(r[3] || ""),
        uraian: String(r[4] || ""),
        penjelasan: String(r[5] || ""),
        volume: Number(r[6]) || 0,
        satuan: String(r[7] || ""),
        tarifHarga: Number(r[8]) || 0,
        jumlah: Number(r[9]) || 0,
        tanggalRealisasi: r[10] instanceof Date ? Utilities.formatDate(r[10], "GMT+7", "yyyy-MM-dd") : String(r[10] || ""),
        bnuBpu: String(r[11] || ""),
        realisasiBelanja: Number(r[12]) || 0,
        namaToko: tokoVal,
        bulanAsal: String(r[15] || "")
      };
    });

    return ContentService.createTextOutput(JSON.stringify({
      status: "success",
      source: "data_sheet",
      items: items,
      daftarToko: daftarToko
    })).setMimeType(ContentService.MimeType.JSON);
  } catch (err) {
    return ContentService.createTextOutput(JSON.stringify({
      status: "error",
      message: err.toString()
    })).setMimeType(ContentService.MimeType.JSON);
  }
}

function doPost(e) {
  var lock = LockService.getScriptLock();
  try {
    lock.waitLock(30000);
    if (!e || !e.postData || !e.postData.contents) {
      throw new Error("Tidak ada data postData yang diterima.");
    }
    var payload = JSON.parse(e.postData.contents);
    var ss = getTargetSpreadsheet();

    // 1. Simpan cadangan JSON secara multi-baris di CONFIG_BOSP (Bebas limit 50.000 karakter)
    var configSheet = ss.getSheetByName("CONFIG_BOSP");
    if (!configSheet) {
      configSheet = ss.insertSheet("CONFIG_BOSP");
      try { configSheet.hideSheet(); } catch(ignore) {}
    } else {
      configSheet.clear();
    }
    var rawText = String(e.postData.contents);
    var chunkSize = 35000;
    var totalChunks = Math.ceil(rawText.length / chunkSize);
    configSheet.getRange(1, 1).setValue(totalChunks);
    configSheet.getRange(1, 2).setValue(new Date().toISOString());
    for (var c = 0; c < totalChunks; c++) {
      configSheet.getRange(c + 2, 1).setValue(rawText.substring(c * chunkSize, (c + 1) * chunkSize));
    }

    var items = payload.items || [];
    var DAFTAR_BULAN_REF = [
      "Januari", "Februari", "Maret", "April", "Mei", "Juni",
      "Juli", "Agustus", "September", "Oktober", "November", "Desember"
    ];

    // Tentukan seluruh bulan yang harus dibuatkan sheet (dari selectedMonths + bulan di items)
    var bulanSet = {};
    (payload.selectedMonths || []).forEach(function(b) { if (b) bulanSet[b] = true; });
    items.forEach(function(it) { if (it && it.bulan) bulanSet[it.bulan] = true; });

    // Urutkan sheet sesuai urutan kalender resmi 12 bulan (Januari s.d. Desember)
    var targetBulanList = DAFTAR_BULAN_REF.filter(function(b) { return bulanSet[b]; });
    if (targetBulanList.length === 0) {
      targetBulanList = (payload.selectedMonths && payload.selectedMonths.length > 0)
        ? payload.selectedMonths
        : DAFTAR_BULAN_REF;
    }

    var headerKolom = [
      "No. Urut", "Kode Rekening", "Uraian Belanja", "Penjelasan Uraian",
      "Volume", "Satuan", "Tarif Satuan (Rp)", "Jumlah Alokasi (Rp)", "Tanggal Realisasi",
      "BNU / BPU", "Realisasi Belanja (Rp)", "Selisih (Rp)", "Nama Toko SIPLah", "Status SPJ"
    ];

    // 2. BUAT / PERBARUI MASING-MASING SHEET PER-BULAN (Juli, Agustus, September, dst.)
    targetBulanList.forEach(function(namaBln) {
      var mSheet = ss.getSheetByName(namaBln);
      if (!mSheet) {
        mSheet = ss.insertSheet(namaBln);
      } else {
        mSheet.clear();
      }

      // Tulis Judul & Header Bulan
      mSheet.appendRow(headerKolom);
      mSheet.getRange(1, 1, 1, headerKolom.length)
        .setBackground("#083344")
        .setFontColor("#06B6D4")
        .setFontWeight("bold")
        .setHorizontalAlignment("center");

      var mItems = items.filter(function(it) {
        return String(it.bulan || "").trim().toLowerCase() === namaBln.toLowerCase();
      });

      if (mItems.length > 0) {
        var mRows = mItems.map(function(it, idx) {
          var hasKode = /\\d/.test(String(it.kodeRekening || ""));
          var j = Number(it.jumlah) || 0;
          var r = Number(it.realisasiBelanja) || 0;
          var selisih = j - r;
          var lengkap = hasKode && j > 0 && it.tanggalRealisasi && it.bnuBpu && r > 0 && it.namaToko;

          return [
            idx + 1,
            String(it.kodeRekening || ""),
            String(it.uraian || ""),
            String(it.penjelasan || ""),
            hasKode ? (Number(it.volume) || 0) : "",
            hasKode ? String(it.satuan || "") : "",
            hasKode ? (Number(it.tarifHarga) || 0) : "",
            hasKode ? j : "",
            String(it.tanggalRealisasi || ""),
            String(it.bnuBpu || ""),
            hasKode ? r : "",
            hasKode ? selisih : "",
            String(it.namaToko || ""),
            hasKode ? (lengkap ? "TEREALISASI LENGKAP" : "BELUM LENGKAP") : "JUDUL/HEADER"
          ];
        });

        mSheet.getRange(2, 1, mRows.length, headerKolom.length).setValues(mRows);
        mSheet.autoResizeColumns(1, headerKolom.length);
      } else {
        // Jika belum ada rincian transaksi pada bulan ini, sediakan baris siap pakai
        mSheet.getRange(2, 1, 1, headerKolom.length).setValues([[
          "-", "-", "(Belum ada rincian belanja untuk bulan " + namaBln + ")", "", "", "", "", "", "", "", "", "", "", ""
        ]]);
        mSheet.autoResizeColumns(1, headerKolom.length);
      }
    });

    // 3. PERBARUI SHEET DATA_BOSP (Rekap Gabungan Semua Bulan)
    var allSheet = ss.getSheetByName("DATA_BOSP");
    if (!allSheet) {
      allSheet = ss.insertSheet("DATA_BOSP");
    } else {
      allSheet.clear();
    }

    var allHeaders = [
      "ID", "Tahun", "Bulan", "Kode Rekening", "Uraian Belanja", "Penjelasan Uraian",
      "Volume", "Satuan", "Tarif Satuan (Rp)", "Jumlah Alokasi (Rp)", "Tanggal Realisasi",
      "BNU / BPU", "Realisasi Belanja (Rp)", "Selisih (Rp)", "Nama Toko SIPLah", "Bulan Asal", "Status SPJ", "Waktu Simpan"
    ];
    allSheet.appendRow(allHeaders);
    allSheet.getRange(1, 1, 1, allHeaders.length)
      .setBackground("#083344")
      .setFontColor("#06B6D4")
      .setFontWeight("bold")
      .setHorizontalAlignment("center");

    if (items.length > 0) {
      var allRows = items.map(function(it) {
        var hasKode = /\\d/.test(String(it.kodeRekening || ""));
        var j = Number(it.jumlah) || 0;
        var r = Number(it.realisasiBelanja) || 0;
        var selisih = j - r;
        var lengkap = hasKode && j > 0 && it.tanggalRealisasi && it.bnuBpu && r > 0 && it.namaToko;

        return [
          String(it.id || ""),
          it.tahun || payload.tahunAnggaran || 2026,
          it.bulan || "",
          String(it.kodeRekening || ""),
          String(it.uraian || ""),
          String(it.penjelasan || ""),
          Number(it.volume) || 0,
          String(it.satuan || ""),
          Number(it.tarifHarga) || 0,
          j,
          String(it.tanggalRealisasi || ""),
          String(it.bnuBpu || ""),
          r,
          selisih,
          String(it.namaToko || ""),
          String(it.bulanAsal || ""),
          lengkap ? "TEREALISASI LENGKAP" : (hasKode ? "BELUM LENGKAP" : "JUDUL/HEADER"),
          new Date()
        ];
      });
      allSheet.getRange(2, 1, allRows.length, allHeaders.length).setValues(allRows);
      allSheet.autoResizeColumns(1, allHeaders.length);
    }

    // 4. PERBARUI SHEET DAFTAR_TOKO
    var tokoSheet = ss.getSheetByName("DAFTAR_TOKO");
    if (!tokoSheet) {
      tokoSheet = ss.insertSheet("DAFTAR_TOKO");
    } else {
      tokoSheet.clear();
    }
    tokoSheet.appendRow(["No", "Nama Toko SIPLah / Rekan", "Terakhir Diperbarui"]);
    tokoSheet.getRange(1, 1, 1, 3)
      .setBackground("#083344")
      .setFontColor("#06B6D4")
      .setFontWeight("bold")
      .setHorizontalAlignment("center");

    var daftarToko = payload.daftarToko || [];
    if (daftarToko.length > 0) {
      var tokoRows = daftarToko.map(function(t, idx) {
        return [idx + 1, String(t).trim(), new Date()];
      });
      tokoSheet.getRange(2, 1, tokoRows.length, 3).setValues(tokoRows);
      tokoSheet.autoResizeColumns(1, 3);
    }

    return ContentService.createTextOutput(JSON.stringify({
      status: "success",
      message: "Data berhasil disimpan per-sheet bulan: [" + targetBulanList.join(", ") + "] & " + items.length + " rekening belanja!",
      targetMonths: targetBulanList,
      totalItems: items.length,
      timestamp: new Date().toISOString()
    })).setMimeType(ContentService.MimeType.JSON);
  } catch (err) {
    return ContentService.createTextOutput(JSON.stringify({
      status: "error",
      message: err.toString()
    })).setMimeType(ContentService.MimeType.JSON);
  } finally {
    try { lock.releaseLock(); } catch(e) {}
  }
}`;

    const DEFAULT_COL_WIDTHS = [
      55,   // 0: No. Urut
      140,  // 1: Kode Rekening
      190,  // 2: Uraian Belanja
      220,  // 3: Penjelasan Uraian
      210,  // 4: Rincian Perhitungan
      130,  // 5: Alokasi (Rp)
      160,  // 6: Tanggal Realisasi
      140,  // 7: BNU / BPU
      160,  // 8: Realisasi Belanja
      130,  // 9: Selisih
      190,  // 10: Nama Toko SIPLah
      210,  // 11: Keterangan SPJ
      85    // 12: Aksi
    ];

    const INITIAL_DATA = [];

    function hasAngkaKodeRekening(kode) {
      if (!kode) return false;
      return /\d/.test(String(kode));
    }

    function formatRupiah(val) {
      const num = Number(val);
      if (isNaN(num)) return "Rp 0";
      const bulat = Math.round(num);
      if (bulat < 0) {
        return "-Rp " + Math.abs(bulat).toLocaleString('id-ID');
      }
      return "Rp " + bulat.toLocaleString('id-ID');
    }

    function cekKelengkapanSpj(item) {
      if (!hasAngkaKodeRekening(item.kodeRekening)) return true;
      const adaJumlah = Number(item.jumlah) > 0;
      const adaTanggal = Boolean(item.tanggalRealisasi && String(item.tanggalRealisasi).trim().length > 0);
      const adaBnu = Boolean(item.bnuBpu && String(item.bnuBpu).trim().length > 0);
      const adaRealisasi = item.realisasiBelanja !== undefined && item.realisasiBelanja !== null && String(item.realisasiBelanja).trim() !== "" && Number(item.realisasiBelanja) > 0;
      const adaToko = Boolean(item.namaToko && String(item.namaToko).trim().length > 0);

      return adaJumlah && adaTanggal && adaBnu && adaRealisasi && adaToko;
    }

    function periksaKekurangan(item) {
      const kurang = [];
      if (!item.tanggalRealisasi || String(item.tanggalRealisasi).trim() === "") kurang.push("Tgl Realisasi");
      if (!item.bnuBpu || String(item.bnuBpu).trim() === "") kurang.push("BNU/BPU");
      if (item.realisasiBelanja === undefined || Number(item.realisasiBelanja) <= 0) kurang.push("Realisasi Belanja");
      if (!item.namaToko || String(item.namaToko).trim() === "") kurang.push("Nama Toko SIPLah");
      return kurang;
    }

    function getHeaderStyle(items, currentIndex) {
      if (hasAngkaKodeRekening(items[currentIndex].kodeRekening)) {
        return { bg: "#424242", border: "#575757", groupLength: 1, pos: 0 };
      }
      let start = currentIndex;
      while (start > 0 && !hasAngkaKodeRekening(items[start - 1].kodeRekening)) {
        start--;
      }
      let end = currentIndex;
      while (end < items.length - 1 && !hasAngkaKodeRekening(items[end + 1].kodeRekening)) {
        end++;
      }
      const groupLength = end - start + 1;
      const pos = currentIndex - start;
      let bg = "#424242";
      let border = "#575757";

      if (groupLength >= 3) {
        if (pos === 0) { bg = "#212121"; border = "#333333"; }
        else if (pos === 1) { bg = "#424242"; border = "#575757"; }
        else { bg = "#757575"; border = "#8a8a8a"; }
      } else if (groupLength === 2) {
        if (pos === 0) { bg = "#212121"; border = "#333333"; }
        else { bg = "#424242"; border = "#575757"; }
      }
      return { bg, border, groupLength, pos };
    }

    function cariPaketHeaderItem(itemList, itemId, bulan) {
      const targetItem = itemList.find(it => it.id === itemId);
      if (!targetItem || !hasAngkaKodeRekening(targetItem.kodeRekening)) return [];
      const itemsBulanIni = itemList.filter(it => it.bulan === bulan);
      const idx = itemsBulanIni.findIndex(it => it.id === itemId);

      if (idx !== -1) {
        let pointer = idx - 1;
        while (pointer >= 0 && hasAngkaKodeRekening(itemsBulanIni[pointer].kodeRekening)) {
          pointer--;
        }
        const paketDitemukan = [];
        while (pointer >= 0 && !hasAngkaKodeRekening(itemsBulanIni[pointer].kodeRekening)) {
          paketDitemukan.unshift(itemsBulanIni[pointer]);
          pointer--;
        }
        if (paketDitemukan.length > 0) return paketDitemukan;
      }
      return [];
    }

    function alihkanItemDanHeader(prevItems, targetItemId, targetBulan, tglBaru) {
      const targetItem = prevItems.find(it => it.id === targetItemId);
      if (!targetItem) return { newItems: prevItems, bulanAsal: "", headerUraian: "" };

      const bulanAsal = targetItem.bulan;
      if (bulanAsal === targetBulan) {
        return {
          newItems: prevItems.map(it => it.id === targetItemId ? { ...it, tanggalRealisasi: tglBaru !== undefined ? tglBaru : it.tanggalRealisasi } : it),
          bulanAsal,
          headerUraian: ""
        };
      }

      const paketInduk = cariPaketHeaderItem(prevItems, targetItemId, bulanAsal);
      const namaPaketList = paketInduk.map(h => h.uraian.trim());
      const deskripsiPaket = namaPaketList.join(" » ");

      const itemTransaksiDiBulanAsalDenganPaketSama = prevItems.filter(it => {
        if (it.bulan !== bulanAsal || !hasAngkaKodeRekening(it.kodeRekening) || it.id === targetItemId) return false;
        const paketItemLain = cariPaketHeaderItem(prevItems, it.id, bulanAsal);
        if (paketItemLain.length !== paketInduk.length) return false;
        return paketItemLain.every((h, idx) => h.uraian.trim() === paketInduk[idx].uraian.trim());
      });

      const sisaTransaksiDiBulanAsal = itemTransaksiDiBulanAsalDenganPaketSama.length;

      let hasilItems = prevItems.map(it => {
        if (it.id === targetItemId) {
          const asalAwal = it.bulanAsal || bulanAsal;
          return {
            ...it,
            bulan: targetBulan,
            bulanAsal: asalAwal !== targetBulan ? asalAwal : "",
            kategoriUraian: deskripsiPaket || it.kategoriUraian || "",
            tanggalRealisasi: tglBaru !== undefined ? tglBaru : it.tanggalRealisasi
          };
        }
        return it;
      });

      if (paketInduk.length > 0) {
        const itemsBulanTujuan = hasilItems.filter(it => it.bulan === targetBulan);
        const sudahAdaDiBulanTujuan = paketInduk.every(hInduk => 
          itemsBulanTujuan.some(itB => !hasAngkaKodeRekening(itB.kodeRekening) && itB.uraian.trim() === hInduk.uraian.trim())
        );

        if (!sudahAdaDiBulanTujuan) {
          const stamp = Date.now();
          const paketBaruBulanB = paketInduk.map((hInduk, idx) => ({
            id: `hdr_${stamp}_${idx}_${Math.random().toString(36).substr(2, 5)}`,
            tahun: targetItem.tahun,
            bulan: targetBulan,
            kodeRekening: hInduk.kodeRekening || "",
            uraian: hInduk.uraian || "",
            penjelasan: hInduk.penjelasan || "",
            volume: 0,
            satuan: "",
            tarifHarga: 0,
            jumlah: 0,
            realisasiBelanja: 0
          }));

          const targetIndex = hasilItems.findIndex(it => it.id === targetItemId);
          if (targetIndex !== -1) {
            hasilItems.splice(targetIndex, 0, ...paketBaruBulanB);
          } else {
            hasilItems.push(...paketBaruBulanB);
          }
        }
      }

      if (paketInduk.length > 0 && sisaTransaksiDiBulanAsal === 0) {
        const idsPaketHapus = new Set(paketInduk.map(h => h.id));
        hasilItems = hasilItems.filter(it => !idsPaketHapus.has(it.id));
      }

      return {
        newItems: hasilItems,
        bulanAsal,
        headerUraian: deskripsiPaket,
        jumlahBarisPaket: paketInduk.length,
        sisaTransaksiDiBulanAsal
      };
    }

      const handleSaveGasUrl = (e) => {
        if (e) e.preventDefault();
        try {
          localStorage.setItem(STORAGE_GAS_URL_KEY, gasUrl.trim());
          tampilkanToast("URL Web App Apps Script berhasil disimpan.", "sukses", "URL Disimpan");
        } catch (err) {
          tampilkanToast("Gagal menyimpan URL ke memori.", "peringatan");
        }
      };

      const handleTestKoneksi = async () => {
        const urlTarget = gasUrl.trim();
        if (!urlTarget || !urlTarget.startsWith("http")) {
          setConnectionTestResult({
            success: false,
            message: "Tautan URL kosong atau format tidak valid.",
            detail: "Pastikan URL diawali dengan https://script.google.com/macros/s/.../exec"
          });
          tampilkanToast("Masukkan URL Web App Apps Script terlebih dahulu.", "peringatan", "URL Belum Valid");
          return;
        }

        try {
          localStorage.setItem(STORAGE_GAS_URL_KEY, urlTarget);
        } catch (e) {}

        setIsTestingGas(true);
        setConnectionTestResult(null);
        const startTime = Date.now();

        try {
          const separator = urlTarget.includes("?") ? "&" : "?";
          const pingUrl = `${urlTarget}${separator}action=ping&_t=${Date.now()}`;

          const response = await fetch(pingUrl, {
            method: "GET",
            headers: { "Accept": "application/json" }
          });
          const latency = Date.now() - startTime;

          if (!response.ok) {
            throw new Error(`Server Google merespon dengan status HTTP ${response.status} (${response.statusText})`);
          }

          const result = await response.json();
          if (result && result.status === "success") {
            setConnectionTestResult({
              success: true,
              latency,
              spreadsheetName: result.spreadsheetName || "Spreadsheet Terhubung",
              spreadsheetId: result.spreadsheetId || "-",
              message: result.message || "Tautan Web App Google Apps Script terhubung sempurna!",
              detail: `Waktu respon: ${latency} ms. Izin akses Web App terbuka (Anyone) & siap digunakan untuk sinkronisasi.`
            });
            tampilkanToast(`Koneksi sukses! Terhubung ke "${result.spreadsheetName || 'Spreadsheet'}" (${latency} ms).`, "sukses", "Uji Koneksi Berhasil");
          } else {
            throw new Error(result ? (result.message || "Respon format skrip tidak dikenali") : "Gagal mengurai respon");
          }
        } catch (err) {
          const latency = Date.now() - startTime;
          setConnectionTestResult({
            success: false,
            latency,
            message: "Gagal terhubung ke Google Apps Script.",
            detail: `${err.message || err.toString()}. Pastikan Deployment Web App diatur Who has access: Anyone.`
          });
          tampilkanToast("Uji koneksi gagal. Pastikan hak akses Web App disetel ke 'Anyone'.", "peringatan", "Koneksi Gagal");
        } finally {
          setIsTestingGas(false);
        }
      };

      const handleKirimKeSpreadsheet = async () => {
        const urlTarget = gasUrl && gasUrl.trim().startsWith("http") ? gasUrl.trim() : PERMANENT_GAS_URL;
        if (!urlTarget) {
          tampilkanToast("Silakan masukkan URL Web App Google Apps Script terlebih dahulu.", "peringatan", "URL Belum Diisi");
          return;
        }

        setIsSyncingGas(true);
        const payload = {
          tahunAnggaran,
          selectedMonths: (daftarBulanAktif && daftarBulanAktif.length > 0) ? daftarBulanAktif : selectedMonths,
          items,
          daftarToko,
          updatedAt: new Date().toISOString()
        };
        const jsonBody = JSON.stringify(payload);

        try {
          let berhasil = false;
          let responPesan = "";
          try {
            const response = await fetch(urlTarget, {
              method: "POST",
              mode: "cors",
              redirect: "follow",
              headers: { "Content-Type": "text/plain;charset=utf-8" },
              body: jsonBody
            });
            if (response.ok) {
              const result = await response.json();
              if (result && result.status === "success") {
                berhasil = true;
                responPesan = result.message || "";
              }
            }
          } catch (corsErr) {
            console.warn("Jalur CORS dialihkan ke mode no-cors...");
          }

          if (!berhasil) {
            await fetch(urlTarget, {
              method: "POST",
              mode: "no-cors",
              redirect: "follow",
              headers: { "Content-Type": "text/plain;charset=utf-8" },
              body: jsonBody
            });
            berhasil = true;
          }

          if (berhasil) {
            const waktu = new Date().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
            setLastGasSyncTime(waktu);
            try {
              localStorage.setItem("sdn137_bosp_last_gas_sync", waktu);
            } catch (e) {}

            tampilkanToast(
              responPesan || `Data belanja (${items.length} rekening & ${daftarToko.length} toko) berhasil dikirim dan dibuatkan per-sheet bulan di Spreadsheet!`,
              "sukses",
              "Data Berhasil Disimpan ke Spreadsheet"

          console.error("Gagal mengirim ke Spreadsheet:", err);

          setIsAdminModalOpen(true);
          setAdminTab("koneksi");
        } finally {
          setIsSyncingGas(false);
        }
      };

      const handleTarikDariSpreadsheet = async (isSilent = false) => {
        const urlTarget = gasUrl && gasUrl.trim().startsWith("http") ? gasUrl.trim() : PERMANENT_GAS_URL;
        if (!urlTarget) {
          if (!isSilent) tampilkanToast("Silakan masukkan URL Web App Google Apps Script terlebih dahulu.", "peringatan", "URL Belum Diisi");
          return;
        }

        setIsSyncingGas(true);
        try {
          const response = await fetch(urlTarget);
          const result = await response.json();

          if (result && result.status === "success") {
            let dataDiambil = [];
            let tokoDiambil = [];

            if (result.payload) {
              if (Array.isArray(result.payload.items)) dataDiambil = result.payload.items;
              if (Array.isArray(result.payload.daftarToko)) tokoDiambil = result.payload.daftarToko;
              if (result.payload.tahunAnggaran) setTahunAnggaran(Number(result.payload.tahunAnggaran));
              if (result.payload.selectedMonths && Array.isArray(result.payload.selectedMonths)) {
                setSelectedMonths(result.payload.selectedMonths);
              }
            } else {
              if (Array.isArray(result.items)) dataDiambil = result.items;
              if (Array.isArray(result.daftarToko)) tokoDiambil = result.daftarToko;
            }

            if (Array.isArray(result.daftarToko)) {
              result.daftarToko.forEach(t => {
                if (filterBukanDummy(t) && !tokoDiambil.includes(t)) tokoDiambil.push(t);
              });
            }

            const tokoBersih = tokoDiambil.filter(filterBukanDummy);
            const itemsBersih = dataDiambil.map(it => {
              const tokoStr = String(it.namaToko || "").trim();
              // Bersihkan jika nama toko terisi nominal angka akibat pergeseran kolom atau dummy
              if (/^-?\d+([.,]\d+)?$/.test(tokoStr.replace(/\s/g, '')) || !filterBukanDummy(tokoStr)) {
                return { ...it, namaToko: "" };
              }
              return it;
            });

            if (tokoBersih.length > 0) setDaftarToko(tokoBersih);
            if (itemsBersih.length > 0) setItems(itemsBersih);

            const waktu = new Date().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
            setLastGasSyncTime(waktu);
            try {
              localStorage.setItem("sdn137_bosp_last_gas_sync", waktu);
            } catch (e) {}

            if (!isSilent) {
              tampilkanToast(
                `Berhasil mengambil ${itemsBersih.length} rekening belanja dan ${tokoBersih.length} toko SIPLah asli dari Spreadsheet!`,
                "sukses",
                "Data Ditarik dari Spreadsheet"
              );
            }
          }
        } catch (err) {
          console.error("Gagal menarik data:", err);
          if (!isSilent) tampilkanToast("Gagal mengambil data dari Spreadsheet.", "peringatan", "Gagal Tarik Data");
        } finally {
          setIsSyncingGas(false);
        }
      };

      useEffect(() => {
        if (PERMANENT_GAS_URL) {
          handleTarikDariSpreadsheet(true);
        }
      }, []);

      const startResizing = (colIdx, clientX) => {
        resizeInfoRef.current = {
          colIdx,
          startX: clientX,
          startWidth: colWidths[colIdx]
        };
        setResizingCol(colIdx);
      };

      useEffect(() => {
        try {
          localStorage.setItem(STORAGE_COL_WIDTHS_KEY, JSON.stringify(colWidths));
        } catch (e) {}
      }, [colWidths]);

      useEffect(() => {
        if (resizingCol === null) return;

        const handleMove = (e) => {
          if (!resizeInfoRef.current) return;
          const clientX = e.touches && e.touches[0] ? e.touches[0].clientX : e.clientX;
          const deltaX = clientX - resizeInfoRef.current.startX;
          const newWidth = Math.max(45, Math.round(resizeInfoRef.current.startWidth + deltaX));

          setColWidths(prev => {
            const next = [...prev];
            next[resizeInfoRef.current.colIdx] = newWidth;
            return next;
          });
        };

        const handleEnd = () => {
          setResizingCol(null);
          resizeInfoRef.current = null;
        };

        document.body.style.userSelect = 'none';
        document.body.style.cursor = 'col-resize';
        window.addEventListener('mousemove', handleMove);
        window.addEventListener('mouseup', handleEnd);
        window.addEventListener('touchmove', handleMove, { passive: false });
        window.addEventListener('touchend', handleEnd);

        return () => {
          document.body.style.userSelect = '';
          document.body.style.cursor = '';
          window.removeEventListener('mousemove', handleMove);
          window.removeEventListener('mouseup', handleEnd);
          window.removeEventListener('touchmove', handleMove);
          window.removeEventListener('touchend', handleEnd);
        };
      }, [resizingCol]);

      const totalTableWidth = useMemo(() => {
        return colWidths.reduce((acc, w) => acc + w, 0);
      }, [colWidths]);

      const handleResetColWidths = () => {
        setColWidths(DEFAULT_COL_WIDTHS);
        setIsFullTableView(false);
        tampilkanToast("Lebar kolom tabel dikembalikan ke ukuran standar.", "info", "Ukuran Kolom Direset");
      };

      const handleToggleTampilanPenuh = () => {
        if (!isFullTableView) {
          const containerWidth = tableContainerRef.current
            ? tableContainerRef.current.clientWidth
            : (window.innerWidth - 80);
          
          const targetWidth = Math.max(containerWidth - 4, 980);
          const defaultTotal = DEFAULT_COL_WIDTHS.reduce((a, b) => a + b, 0);
          const factor = targetWidth / defaultTotal;

          const fittedWidths = DEFAULT_COL_WIDTHS.map((w, idx) => {
            const minW = idx === 0 ? 40 : (idx === 12 ? 60 : 65);
            return Math.max(minW, Math.floor(w * factor));
          });

          const currentSum = fittedWidths.reduce((a, b) => a + b, 0);
          const diff = targetWidth - currentSum;
          fittedWidths[3] = Math.max(70, fittedWidths[3] + diff);

          setColWidths(fittedWidths);
          setIsFullTableView(true);
          tampilkanToast("Seluruh kolom tabel berhasil disesuaikan pas dengan layar.", "sukses", "Tampilan Penuh Tabel Aktif");
        } else {
          setColWidths(DEFAULT_COL_WIDTHS);

        const file = e.target.files[0];

          try {
            if (!window.XLSX) throw new Error("Pustaka SheetJS belum siap.");
            const data = new Uint8Array(evt.target.result);
            const workbook = window.XLSX.read(data, { type: 'array' });
            const sheet = workbook.Sheets[workbook.SheetNames[0]];
            const rows = window.XLSX.utils.sheet_to_json(sheet, { header: 1 });

            if (!rows || rows.length < 2) {
              tampilkanToast("Berkas Excel tidak memiliki baris data yang valid.", "peringatan");
              return;
            }

            const newItems = [];
            let paketHeaderAktif = [];

            for (let i = 1; i < rows.length; i++) {
              const r = rows[i];
              if (!r || (!r[1] && !r[2])) continue;

              const kode = String(r[1] || "").trim();
              const uraianTeks = String(r[2] || "").trim();
              const isHeader = !hasAngkaKodeRekening(kode);

              if (isHeader) {
                if (newItems.length > 0 && hasAngkaKodeRekening(newItems[newItems.length - 1].kodeRekening)) {

                paketHeaderAktif.push({

                  uraian: uraianTeks,
                  penjelasan: String(r[3] || "").trim()
                });

              const tarif = isHeader ? 0 : (parseFloat(r[6]) || 0);
              const jumlah = isHeader ? 0 : ((volume * tarif) > 0 ? (volume * tarif) : (parseFloat(r[7]) || 0));

                const dateObj = new Date(Math.round((r[8] - 25569) * 86400 * 1000));
                tanggal = dateObj.toISOString().split('T')[0];
              }

              const rawToko = String(r[12] || "").trim();

              const namaTokoBersih = (isHeader || isTokoAngka) ? "" : rawToko;

                id: `bosp_up_${Date.now()}_${i}`,
                tahun: tahunAnggaran,
                bulan: targetUploadMonth,
                kategoriUraian: isHeader ? "" : paketHeaderAktif.map(h => h.uraian).join(" » "),

                kodeRekening: kode,

                penjelasan: String(r[3] || "").trim(),

                satuan: isHeader ? "" : String(r[5] || "Paket").trim(),
                tarifHarga: tarif,
                jumlah,
                tanggalRealisasi: isHeader ? "" : tanggal,
                bnuBpu: isHeader ? "" : String(r[9] || "").trim(),
                realisasiBelanja: isHeader ? 0 : (parseFloat(r[10]) || 0),
                namaToko: namaTokoBersih
              });

          } catch (err) {

        };

                    <div className="flex items-center gap-2.5">
                      <div className="w-9 h-9 rounded-xl bg-[#06B6D4]/15 border border-[#06B6D4]/30 flex items-center justify-center text-[#06B6D4]">
                        <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                          <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
                        </svg>
                      </div>
                      <div>
                        <div className="flex items-center gap-2">
                          <h3 className="font-bold text-sm sm:text-base text-[#F3FEFF]">KARTU ADMIN & INTEGRASI SPREADSHEET</h3>
                          <span className="px-2 py-0.5 rounded text-[10px] font-bold bg-[#A3E635]/15 text-[#A3E635] border border-[#A3E635]/30">
                            PIN 977977 Aktif
                          </span>
                        </div>
                        <p className="text-[11px] text-[#A2BBC0]">Pusat kontrol integrasi daring, master toko, dan sinkronisasi berkas</p>
                      </div>
                    </div>

                    <div className="flex flex-wrap items-center gap-2">
                      <button
                        type="button"
                        onClick={handleSimpanSeluruhDataDariAdmin}
                        disabled={isSyncingGas}
                        className="px-3.5 py-1.5 rounded-xl bg-[#A3E635] hover:bg-[#bef264] text-[#041012] text-xs font-black transition flex items-center gap-1.5 shadow-md shadow-[#A3E635]/25 disabled:opacity-50 cursor-pointer active:scale-95"
                        title="Simpan seluruh progres lokal dan kirim langsung ke Spreadsheet"
                      >
                        {isSyncingGas ? (
                          <>
                            <svg className="w-3.5 h-3.5 animate-spin text-[#041012]" fill="none" viewBox="0 0 24 24">
                              <circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4"></circle>
                              <path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path>
                            </svg>
                            <span>Menyimpan Semua...</span>
                          </>
                        ) : (
                          <>
                            <svg className="w-3.5 h-3.5 text-[#041012]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                              <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M8 4H6a2 2 0 00-2 2v12a2 2 0 002 2h12a2 2 0 002-2V8l-4-4H8zm0 0v4h8V4M6 20h12v-8H6v8z"></path>
                            </svg>
                            <span>Simpan Seluruh Data</span>
                          </>
                        )}
                      </button>

                      <button
                        type="button"
                        onClick={handleKunciAdmin}
                        title="Kunci sesi Kartu Admin dan tutup dialog"
                        className="px-3 py-1.5 rounded-xl bg-[#F43F5E]/15 hover:bg-[#F43F5E]/25 text-[#F43F5E] text-xs font-bold border border-[#F43F5E]/30 transition flex items-center gap-1.5 cursor-pointer active:scale-95"
                      >
                        <svg className="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                          <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path>
                        </svg>
                        <span>Kunci Admin</span>
                      </button>

                      <button
                        type="button"
                        onClick={() => setIsAdminModalOpen(false)}
                        className="text-[#A2BBC0] hover:text-[#F3FEFF] p-1.5 rounded-lg hover:bg-[#10282C] transition"
                        title="Tutup jendela tanpa mengunci"
                      >
                        ✕
                      </button>
                    </div>
                  </div>

                  {}
                  <div className="p-4 overflow-y-auto space-y-4 flex-1">
                    <div className="flex gap-2 border-b border-[#06B6D4]/20 pb-2">
                      <button onClick={() => setAdminTab("toko")} className={`px-3 py-1 text-xs rounded-lg font-bold transition ${adminTab === 'toko' ? 'bg-[#06B6D4] text-[#041012]' : 'text-[#A2BBC0] hover:text-white'}`}>
                        Master Toko ({daftarToko.length})
                      </button>
                      <button onClick={() => setAdminTab("koneksi")} className={`px-3 py-1 text-xs rounded-lg font-bold transition ${adminTab === 'koneksi' ? 'bg-[#06B6D4] text-[#041012]' : 'text-[#A2BBC0] hover:text-white'}`}>
                        Koneksi URL
                      </button>
                      <button onClick={() => setAdminTab("kode")} className={`px-3 py-1 text-xs rounded-lg font-bold transition ${adminTab === 'kode' ? 'bg-[#06B6D4] text-[#041012]' : 'text-[#A2BBC0] hover:text-white'}`}>
                        Kode Code.gs
                      </button>
                    </div>

                    {adminTab === 'toko' && (
                      <div className="space-y-3">
                        <form onSubmit={handleTambahToko} className="flex gap-2">
                          <input
                            type="text"
                            placeholder="Tambah nama toko SIPLah baru..."
                            value={inputTokoBaru}
                            onChange={e => setInputTokoBaru(e.target.value)}
                            className="flex-1 bg-[#041012] border border-[#06B6D4]/40 rounded-lg px-3 py-1.5 text-xs text-white"
                          />
                          <button type="submit" className="px-4 py-1.5 bg-[#06B6D4] text-[#041012] font-bold rounded-lg text-xs">Tambah</button>
                        </form>
                        <div className="max-h-60 overflow-y-auto space-y-1">
                          {daftarToko.map((t, idx) => (
                            <div key={idx} className="flex justify-between items-center bg-[#041012] p-2 rounded-lg border border-[#06B6D4]/15 text-xs">
                              <span>{t}</span>
                              <button onClick={() => handleHapusToko(t)} className="text-[#F43F5E]">Hapus</button>
                            </div>
                          ))}
                        </div>
                      </div>
                    )}

                    {adminTab === 'koneksi' && (
                      <div className="space-y-3">
                        <input
                          type="url"
                          value={gasUrl}
                          onChange={e => setGasUrl(e.target.value)}
                          className="w-full bg-[#041012] border border-[#06B6D4]/40 rounded-lg px-3 py-2 text-xs font-mono text-white"
                        />
                        <div className="flex gap-2">
                          <button onClick={handleSaveGasUrl} className="px-3 py-1.5 bg-[#06B6D4] text-[#041012] font-bold rounded-lg text-xs">Simpan URL</button>
                          <button onClick={handleTestKoneksi} className="px-3 py-1.5 bg-[#A3E635] text-[#041012] font-bold rounded-lg text-xs">Uji Koneksi</button>
                        </div>
                      </div>
                    )}

                    {adminTab === 'kode' && (
                      <div className="space-y-2">
                        <button onClick={() => salinTeksKeClipboard(KODE_GOOGLE_APPS_SCRIPT)} className="px-3 py-1 bg-[#A3E635] text-[#041012] font-bold rounded text-xs">Salin Skrip</button>
                        <pre className="p-3 bg-[#041012] text-xs font-mono text-[#A2BBC0] max-h-60 overflow-y-auto rounded-lg">{KODE_GOOGLE_APPS_SCRIPT}</pre>
                      </div>
                    )}
                  </div>

                  {}
                  <div className="p-3.5 bg-[#041012] border-t border-[#06B6D4]/20 flex flex-wrap items-center justify-between gap-2.5 text-xs text-[#A2BBC0]">
                    <div className="flex items-center gap-2">
                      <span className="w-2 h-2 rounded-full bg-[#A3E635]"></span>
                      <span>Otorisasi: <strong className="text-[#A3E635]">PIN 977977</strong> {lastGasSyncTime ? `| Sinkron: ${lastGasSyncTime}` : ''}</span>
                    </div>

                    <div className="flex flex-wrap items-center gap-2">
                      <button
                        type="button"
                        onClick={handleSimpanSeluruhDataDariAdmin}
                        disabled={isSyncingGas}
                        className="px-4 py-2 rounded-xl bg-[#A3E635] hover:bg-[#bef264] text-[#041012] font-black text-xs transition flex items-center gap-1.5 shadow-md shadow-[#A3E635]/20 cursor-pointer disabled:opacity-50"
                      >
                        <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                          <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M8 4H6a2 2 0 00-2 2v12a2 2 0 002 2h12a2 2 0 002-2V8l-4-4H8zm0 0v4h8V4M6 20h12v-8H6v8z"></path>
                        </svg>
                        <span>Simpan Seluruh Data (Lokal & Spreadsheet)</span>
                      </button>

                      <button
                        type="button"
                        onClick={handleKunciAdmin}
                        className="px-3.5 py-2 rounded-xl bg-[#F43F5E]/15 hover:bg-[#F43F5E]/25 text-[#F43F5E] text-xs font-bold border border-[#F43F5E]/30 transition flex items-center gap-1 cursor-pointer"
                      >
                        <svg className="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                          <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path>
                        </svg>
                        <span>Kunci Kartu Admin</span>
                      </button>

                      <button
                        type="button"
                        onClick={() => setIsAdminModalOpen(false)}
                        className="px-4 py-2 rounded-xl bg-[#10282C] hover:bg-[#17363C] text-[#F3FEFF] font-semibold border border-[#06B6D4]/30 transition"
                      >
                        Tutup
                      </button>
                    </div>
                  </div>

                </div>
              </div>
            )}

            <input type="file" ref={fileInputRef} accept=".xlsx, .xls" className="hidden" onChange={handleFileUpload} />
            <input type="file" ref={jsonImportRef} accept=".json" className="hidden" onChange={handleImportBackupJson} />

            <datalist id="datalist-toko-siplah">
              {daftarToko.map((toko, idx) => (
                <option key={idx} value={toko} />
              ))}
            </datalist>

            {toast.show && (
              <div className="fixed bottom-5 right-5 z-50 max-w-md bg-[#10282C] border border-[#06B6D4]/50 rounded-xl p-4 shadow-2xl flex items-start gap-3">
                <div className={`mt-0.5 ${toast.type === 'sukses' ? 'text-[#A3E635]' : 'text-[#06B6D4]'}`}>✓</div>
                <div>
                  <h5 className="text-xs font-bold text-[#F3FEFF]">{toast.title}</h5>
                  <p className="text-xs text-[#A2BBC0] mt-0.5">{toast.message}</p>
                </div>
              </div>
            )}

          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
