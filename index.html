    function formatRupiah(val) {
      const num = Number(val);
      if (isNaN(num)) return "Rp 0";
      const bulat = Math.round(num);
      if (bulat < 0) {
        return "-Rp " + Math.abs(bulat).toLocaleString('id-ID');
      }
      return "Rp " + bulat.toLocaleString('id-ID');
    }

    function hasAngkaKodeRekening(kode) {
      if (!kode) return false;
      return /\d/.test(String(kode));
    }

    function cekKelengkapanSpj(item) {
      if (!hasAngkaKodeRekening(item.kodeRekening)) return true;
      const adaJumlah = Number(item.jumlah) > 0;
      const adaTanggal = Boolean(item.tanggalRealisasi && String(item.tanggalRealisasi).trim().length > 0);
      const adaBnu = Boolean(item.bnuBpu && String(item.bnuBpu).trim().length > 0);
      const adaRealisasi = item.realisasiBelanja !== undefined && item.realisasiBelanja !== null && String(item.realisasiBelanja).trim() !== "" && Number(item.realisasiBelanja) > 0;
      const selisih = Number(item.jumlah || 0) - Number(item.realisasiBelanja || 0);
      const adaSelisih = !isNaN(selisih);
      const adaToko = Boolean(item.namaToko && String(item.namaToko).trim().length > 0);

      return adaJumlah && adaTanggal && adaBnu && adaRealisasi && adaSelisih && adaToko;
    }

    function periksaKekurangan(item) {
      const kurang = [];
      if (!item.tanggalRealisasi || String(item.tanggalRealisasi).trim() === "") kurang.push("Tgl Realisasi");
      if (!item.bnuBpu || String(item.bnuBpu).trim() === "") kurang.push("BNU/BPU");
      if (item.realisasiBelanja === undefined || Number(item.realisasiBelanja) <= 0) kurang.push("Realisasi Belanja");
      if (!item.namaToko || String(item.namaToko).trim() === "") kurang.push("Nama Toko SIPLah");
      return kurang;
    }

        document.removeEventListener("mousemove", handleMouseMoveResize);
        document.removeEventListener("mouseup", handleMouseUpResize);
      };

      const filteredItemsBulan = useMemo(() => {
        return itemsBulan.filter(item => {
          const isHdr = !hasAngkaKodeRekening(item.kodeRekening);
          if (!showGreyRows && isHdr) return false;

          const cocokSearch =
            searchTerm.trim() === "" ||
            (item.kodeRekening && item.kodeRekening.toLowerCase().includes(searchTerm.toLowerCase())) ||
            (item.uraian && item.uraian.toLowerCase().includes(searchTerm.toLowerCase())) ||
            (item.penjelasan && item.penjelasan.toLowerCase().includes(searchTerm.toLowerCase())) ||
            (item.namaToko && item.namaToko.toLowerCase().includes(searchTerm.toLowerCase())) ||
            (item.bnuBpu && item.bnuBpu.toLowerCase().includes(searchTerm.toLowerCase()));

          const isLengkap = cekKelengkapanSpj(item);
          if (statusFilter === "lengkap") return cocokSearch && isLengkap;
          if (statusFilter === "belum") return cocokSearch && !isLengkap;
          return cocokSearch;
        });
      }, [itemsBulan, searchTerm, statusFilter, showGreyRows]);

      const stats = useMemo(() => {
        let totalAlokasi = 0;
        let totalRealisasi = 0;
        let lengkapCount = 0;
        let countRekeningRiil = 0;

        itemsTahun.forEach(it => {
          const isRek = hasAngkaKodeRekening(it.kodeRekening);
          if (isRek) {
            countRekeningRiil++;
            const j = Number(it.jumlah) || 0;
            const r = Number(it.realisasiBelanja) || 0;
            totalAlokasi += j;
            totalRealisasi += r;
            if (cekKelengkapanSpj(it)) lengkapCount++;
          }
        });

        const totalSelisih = totalAlokasi - totalRealisasi;
        const persenRealisasi = totalAlokasi > 0 ? Math.min(100, Math.round((totalRealisasi / totalAlokasi) * 100)) : 0;
        const persenSpj = countRekeningRiil > 0 ? Math.round((lengkapCount / countRekeningRiil) * 100) : 0;

        return {
          totalAlokasi,
          totalRealisasi,
          totalSelisih,
          lengkapCount,
          countTotal: countRekeningRiil,
          countBelum: countRekeningRiil - lengkapCount,
          persenRealisasi,
          persenSpj
        };

      const tfootBulan = useMemo(() => {

      const rkasStats = useMemo(() => {

      const cariPaketHeaderItem = (daftarSemua, itemTarget) => {
        const itemIdx = daftarSemua.findIndex(it => it.id === itemTarget.id);
        if (itemIdx <= 0) return [];
        const paket = [];
        for (let i = itemIdx - 1; i >= 0; i--) {
          const kandidat = daftarSemua[i];
          if (kandidat.bulan !== itemTarget.bulan) break;
          if (!hasAngkaKodeRekening(kandidat.kodeRekening)) {
            paket.unshift(kandidat);
          } else {
            break;
          }
        }
        return paket;
      };

      const handleTransferMonth = (item, bulanTujuan) => {
        if (!bulanTujuan || bulanTujuan === item.bulan) return;

        const bulanAsal = item.bulanAsal || item.bulan;
        const blnSekarangIdx = DAFTAR_BULAN.indexOf(item.bulan);
        const blnTujuanIdx = DAFTAR_BULAN.indexOf(bulanTujuan);
        const blnAsalIdx = DAFTAR_BULAN.indexOf(bulanAsal);

        // Validasi: hanya boleh maju ke depan, kecuali balik ke bulan asal
        if (blnTujuanIdx < blnSekarangIdx) {
          const isBalikKeBulanAsal = (bulanTujuan === bulanAsal) || (blnTujuanIdx >= blnAsalIdx && item.bulanAsal);
          if (!isBalikKeBulanAsal) {
            tampilkanToast(`Realisasi tidak boleh dialihkan ke bulan sebelumnya (${bulanTujuan}). Belanja hanya dapat dialihkan ke bulan selanjutnya atau dikembalikan ke bulan asalnya (${bulanAsal}).`, "peringatan", "Pengalihan Ditolak");
            return;
          }
        }

        const isKembaliAsal = (bulanTujuan === bulanAsal);
        const paketHeaderAsal = cariPaketHeaderItem(items, item);

        setItems(prevItems => {
          const bulanLama = item.bulan;
          const updated = prevItems.map(it => {
            if (it.id === item.id) {
              return {
                ...it,
                bulan: bulanTujuan,
                bulanAsal: isKembaliAsal ? null : bulanAsal
              };
            }
            return it;
          });

          // Cek apakah di bulan asal masih ada rekening lain
          const sisaRekeningBulanAsal = updated.filter(it => 
            it.bulan === bulanLama && 
            hasAngkaKodeRekening(it.kodeRekening)
          );

          let finalItems = updated;
          if (sisaRekeningBulanAsal.length === 0 && paketHeaderAsal.length > 0) {
            const idHeadersAsal = new Set(paketHeaderAsal.map(h => h.id));
            finalItems = finalItems.filter(it => !idHeadersAsal.has(it.id));
          }

          // Cek header di bulan tujuan
          if (paketHeaderAsal.length > 0) {
            const headersDiTujuan = finalItems.filter(it => 
              it.bulan === bulanTujuan && 
              !hasAngkaKodeRekening(it.kodeRekening)
            );
            const uraianDiTujuan = new Set(headersDiTujuan.map(h => (h.uraian || '').trim().toLowerCase()));

            const headerPerluDitambah = paketHeaderAsal.filter(h => 
              !uraianDiTujuan.has((h.uraian || '').trim().toLowerCase())
            );

            if (headerPerluDitambah.length > 0) {
              const headerBaru = headerPerluDitambah.map(h => ({
                ...h,
                id: `hdr_trans_${Date.now()}_${Math.random().toString(36).substr(2, 5)}`,
                bulan: bulanTujuan
              }));

              const idxItemPindah = finalItems.findIndex(it => it.id === item.id);
              if (idxItemPindah !== -1) {
                finalItems.splice(idxItemPindah, 0, ...headerBaru);
              } else {
                finalItems.unshift(...headerBaru);
              }
            }
          }

          return finalItems;
        });

        setSelectedMonths(prev => prev.includes(bulanTujuan) ? prev : [...prev, bulanTujuan]);
        setActiveMonth(bulanTujuan);
        setIsTransferModalOpen(false);

        if (isKembaliAsal) {
          tampilkanToast(`Rekening ${item.kodeRekening || ''} berhasil dikembalikan ke bulan asalnya (${bulanTujuan}).`, "sukses", "Kembali ke Asal");
        } else {
          tampilkanToast(`Rekening ${item.kodeRekening || ''} dan paket header program berhasil dialihkan dari ${item.bulan} ke ${bulanTujuan}.`, "sukses", "Realisasi Dialihkan");
        }
      };

      const handleInlineUpdate = (id, field, value) => {
        if (field === 'tanggalRealisasi' && value) {
          const item = items.find(it => it.id === id);
          if (item) {
            const dateParts = value.split('-');
            if (dateParts.length === 3) {
              const monthIdx = parseInt(dateParts[1], 10) - 1;
              if (monthIdx >= 0 && monthIdx < DAFTAR_BULAN.length) {
                const targetBulan = DAFTAR_BULAN[monthIdx];
                if (targetBulan !== item.bulan) {
                  const bulanAsal = item.bulanAsal || item.bulan;
                  const blnSekarangIdx = DAFTAR_BULAN.indexOf(item.bulan);
                  const blnTujuanIdx = DAFTAR_BULAN.indexOf(targetBulan);
                  const blnAsalIdx = DAFTAR_BULAN.indexOf(bulanAsal);

                  if (blnTujuanIdx < blnSekarangIdx) {
                    const isBalikKeBulanAsal = (targetBulan === bulanAsal) || (blnTujuanIdx >= blnAsalIdx && item.bulanAsal);
                    if (!isBalikKeBulanAsal) {

                      return;
                    }
                  }

                  handleTransferMonth(item, targetBulan);
                  setTimeout(() => {
                    setItems(prev => prev.map(it => it.id === id ? { ...it, tanggalRealisasi: value } : it));
                  }, 100);
                  return;
                }
              }
            }
          }
        }

        setItems(prevItems => prevItems.map(it => {
          if (it.id === id) {
            return {
              ...it,
              [field]: field === 'realisasiBelanja' ? (parseFloat(value) || 0) : value
            };
          }
          return it;
        }));
      };

            return it;

        } else {

          tampilkanToast(`Rekening baru ditambahkan ke bulan ${formState.bulan}.`, "sukses", "Berhasil");
        }

      const handleSaveRkasItem = (e) => {

        const isHeader = !hasAngkaKodeRekening(rkasFormState.kodeRekening);
        const volume = isHeader ? 0 : (parseFloat(rkasFormState.volume) || 1);
        const tarif = isHeader ? 0 : (parseFloat(rkasFormState.tarifHarga) || 0);
        const jumlah = isHeader ? 0 : (volume * tarif);

        if (editingRkasItem) {
          setRkasItems(prev => prev.map(it => {
            if (it.id === editingRkasItem.id) {
              return {
                ...it,

                standar: rkasFormState.standar,

                jenisBelanja: rkasFormState.jenisBelanja,

          ];

                        </span>
                      </h2>
                      <p className="text-xs text-[#A2BBC0] mt-0.5">
                        Garis kolom dapat digeser bebas. Pengisian <span className="text-[#06B6D4] font-semibold">TGL REALISASI (Kalender), BNU/BPU, Realisasi Belanja,</span> dan <span className="text-[#06B6D4] font-semibold">Nama Toko SIPLah</span> langsung diketik pada baris tabel di bawah.
                      </p>

                      >
                        <svg className="w-3.5 h-3.5 text-[#06B6D4]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                          <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 8h16M4 16h16"></path>
                        </svg>

                      </button>

                      <button

                        }}
                        className={`px-3 py-1.5 rounded-xl text-xs font-bold border transition flex items-center gap-1.5 ${
                          showGreyRows
                            ? "bg-[#374151] text-gray-200 border-gray-500 hover:bg-gray-600"
                            : "bg-[#041012] text-[#A2BBC0] border-[#06B6D4]/30 hover:bg-[#10282C]"

                      >
                        <span>{showGreyRows ? "👁️ Sembunyikan Baris Abu-abu" : "👁️ Tampilkan Baris Abu-abu"}</span>
                      </button>

                        onChange={(e) => setSearchTerm(e.target.value)}

                      />

                  <div className="overflow-x-auto rounded-xl border border-[#06B6D4]/20 shadow-inner">

                      <thead>

                          </th>
                          <th className="p-3 relative">
                            <span>Uraian Belanja</span>
                            <div className="resize-handle" onMouseDown={(e) => handleMouseDownResize(2, e)} onTouchStart={(e) => handleTouchStartResize(2, e)}></div>
                          </th>
                          <th className="p-3 relative">
                            <span>Penjelasan Uraian</span>

                          </th>
                          <th className="p-3 text-center bg-[#10282C]/50 relative">

                          </th>
                          <th className="p-3 text-right relative">
                            <span>Alokasi (Rp)</span>
                            <div className="resize-handle" onMouseDown={(e) => handleMouseDownResize(5, e)} onTouchStart={(e) => handleTouchStartResize(5, e)}></div>
                          </th>
                          <th className="p-3 text-center bg-[#06B6D4]/10 border-x border-[#06B6D4]/25 relative">
                            <span className="text-[#06B6D4] font-bold">Tanggal Realisasi</span>
                            <div className="resize-handle" onMouseDown={(e) => handleMouseDownResize(6, e)} onTouchStart={(e) => handleTouchStartResize(6, e)}></div>
                          </th>
                          <th className="p-3 bg-[#06B6D4]/10 border-r border-[#06B6D4]/25 relative">
                            <span className="text-[#06B6D4] font-bold">BNU / BPU</span>
                            <div className="resize-handle" onMouseDown={(e) => handleMouseDownResize(7, e)} onTouchStart={(e) => handleTouchStartResize(7, e)}></div>

                            <div className="resize-handle" onMouseDown={(e) => handleMouseDownResize(8, e)} onTouchStart={(e) => handleTouchStartResize(8, e)}></div>

                          <th className="p-3 text-right relative">
                            <span>Selisih</span>

                          <th className="p-3 bg-[#06B6D4]/10 border-x border-[#06B6D4]/25 relative">
                            <span className="text-[#06B6D4] font-bold">Nama Toko SIPLah</span>
                            <div className="resize-handle" onMouseDown={(e) => handleMouseDownResize(10, e)} onTouchStart={(e) => handleTouchStartResize(10, e)}></div>
                          </th>
                          <th className="p-3 relative">
                            <span>Keterangan (Status SPJ)</span>
                            <div className="resize-handle" onMouseDown={(e) => handleMouseDownResize(11, e)} onTouchStart={(e) => handleTouchStartResize(11, e)}></div>
                          </th>
                          <th className="p-3 text-center">Aksi</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-[#17363C]">
                        {filteredItemsBulan.length === 0 ? (
                          <tr>
                            <td colSpan="13" className="text-center py-14 text-[#A2BBC0]">
                              <p className="font-semibold text-sm text-[#F3FEFF]">Tidak ada rekening belanja yang ditemukan.</p>
                              <p className="text-xs text-[#A2BBC0] mt-1">
                                {searchTerm || statusFilter !== "all" 
                                  ? "Coba sesuaikan kata kunci pencarian atau filter status." 
                                  : `Bulan ${activeMonth} belum memiliki rekening. Klik tombol "+ Tambah Rekening" untuk memasukkan data.`}
                              </p>
                            </td>
                          </tr>
                        ) : (
                          filteredItemsBulan.map((item, index) => {
                            const isHdr = !hasAngkaKodeRekening(item.kodeRekening);
                            const j = Number(item.jumlah) || 0;
                            const r = Number(item.realisasiBelanja) || 0;
                            const selisih = j - r;
                            const isLengkap = cekKelengkapanSpj(item);

                            if (isHdr) {
                              return (
                                <tr
                                  key={item.id}
                                  onClick={() => handleEditRekening(item)}
                                  className="bg-[#374151] hover:bg-gray-600 text-gray-100 font-bold cursor-pointer transition border-b border-gray-600"
                                  title="Klik baris abu-abu untuk mengedit nama judul/program"
                                >
                                  <td className="p-3 text-center text-gray-300 border-r border-gray-600">{index + 1}</td>
                                  <td className="p-3 text-gray-400 font-mono text-xs border-r border-gray-600">{item.kodeRekening || '-'}</td>
                                  <td className="p-3 text-white uppercase tracking-wider text-xs border-r border-gray-600 font-black">{item.uraian}</td>
                                  <td className="p-3 text-gray-300 text-xs border-r border-gray-600">{item.penjelasan || ''}</td>
                                  <td className="p-3 text-center border-r border-gray-600"></td>
                                  <td className="p-3 text-right border-r border-gray-600"></td>
                                  <td className="p-3 text-center border-r border-gray-600"></td>
                                  <td className="p-3 border-r border-gray-600"></td>
                                  <td className="p-3 text-right border-r border-gray-600"></td>
                                  <td className="p-3 text-right border-r border-gray-600"></td>
                                  <td className="p-3 border-r border-gray-600"></td>
                                  <td className="p-3 border-r border-gray-600 text-center text-gray-400 text-[10px] italic">Header Kategori</td>
                                  <td className="p-3 text-center"></td>
                                </tr>
                              );
                            }

                            const monthNum = String(DAFTAR_BULAN.indexOf(item.bulanAsal || item.bulan) + 1).padStart(2, '0');
                            const minDateAllowed = `${tahunAnggaran}-${monthNum}-01`;

                            return (
                              <tr key={item.id} className="hover:bg-[#17363C]/60 transition border-b border-[#06B6D4]/10">
                                <td className="p-3 text-center font-bold text-[#A2BBC0]">{index + 1}</td>
                                <td className="p-3 font-mono font-bold text-[#06B6D4]">
                                  <div>{item.kodeRekening || '-'}</div>
                                  {item.bulanAsal && item.bulanAsal !== item.bulan && (
                                    <div className="text-[9.5px] font-sans font-bold text-[#A3E635] mt-0.5">
                                      ( Realisasi Alihan dari Bulan {item.bulanAsal} )
                                    </div>
                                  )}
                                </td>
                                <td className="p-3 font-semibold text-[#F3FEFF]">{item.uraian || '-'}</td>
                                <td className="p-3 text-[#A2BBC0] text-[11px] leading-relaxed">{item.penjelasan || '-'}</td>
                                
                                <td className="p-3 bg-[#041012]/40 text-center font-mono text-[11px]">
                                  <div className="grid grid-cols-3 gap-1">
                                    <span>{item.volume}</span>
                                    <span className="text-[#A2BBC0]">{item.satuan || ''}</span>
                                    <span className="text-[#F3FEFF]">{formatRupiah(item.tarifHarga)}</span>
                                  </div>
                                </td>

                                <td className="p-3 text-right font-bold text-[#F3FEFF]">{formatRupiah(j)}</td>

                                <td className="p-2 bg-[#06B6D4]/5 border-x border-[#06B6D4]/20">
                                  <input
                                    type="date"
                                    min={minDateAllowed}
                                    value={item.tanggalRealisasi || ''}
                                    onClick={(e) => { try { e.target.showPicker(); } catch (err) {} }}
                                    onChange={(e) => handleInlineUpdate(item.id, 'tanggalRealisasi', e.target.value)}
                                    className="w-full bg-[#041012] border border-[#06B6D4]/40 focus:border-[#06B6D4] rounded-lg px-2 py-1.5 text-xs text-[#F3FEFF] text-center cursor-pointer transition focus:outline-none"
                                    title="Pilih tanggal realisasi (hanya bisa bulan sama atau selanjutnya)"
                                  />
                                </td>

                                <td className="p-2 bg-[#06B6D4]/5 border-r border-[#06B6D4]/20">
                                  <input
                                    type="text"
                                    value={item.bnuBpu || ''}
                                    placeholder="Nomor BNU..."
                                    onChange={(e) => handleInlineUpdate(item.id, 'bnuBpu', e.target.value)}
                                    className="w-full bg-[#041012] border border-[#06B6D4]/40 focus:border-[#06B6D4] rounded-lg px-2.5 py-1.5 text-xs font-mono text-[#A2BBC0] focus:text-[#F3FEFF] transition focus:outline-none"
                                  />
                                </td>

                                <td className="p-2 bg-[#06B6D4]/5 border-r border-[#06B6D4]/20">
                                  <input
                                    type="number"
                                    step="any"
                                    min="0"
                                    value={item.realisasiBelanja !== undefined ? item.realisasiBelanja : 0}
                                    onChange={(e) => handleInlineUpdate(item.id, 'realisasiBelanja', e.target.value)}
                                    className="w-full bg-[#041012] border border-[#A3E635]/40 focus:border-[#A3E635] rounded-lg px-2.5 py-1.5 text-xs font-bold text-[#A3E635] text-right transition focus:outline-none"
                                  />
                                </td>

                                <td className={`p-3 text-right font-bold ${selisih > 0 ? 'text-[#06B6D4]' : (selisih < 0 ? 'text-[#F43F5E]' : 'text-[#A2BBC0]')}`}>
                                  {formatRupiah(selisih)}
                                </td>

                                <td className="p-2 bg-[#06B6D4]/5 border-x border-[#06B6D4]/20">
                                  <input
                                    type="text"
                                    value={item.namaToko || ''}
                                    placeholder="Penyedia SIPLah..."
                                    onChange={(e) => handleInlineUpdate(item.id, 'namaToko', e.target.value)}

                                </td>

                                    <span className="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-[10px] font-bold bg-[#A3E635]/15 text-[#A3E635] border border-[#A3E635]/40">

                                      Terealisasi Lengkap
                                    </span>
                                  ) : (
                                    <span className="inline-flex items-center gap-1 px-2.5 py-1 rounded-full text-[10px] font-semibold bg-[#F43F5E]/15 text-[#F43F5E] border border-[#F43F5E]/30">
                                      <svg className="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                                      </svg>
                                      Belum Lengkap
                                    </span>
                                  )}
                                </td>

                                <td className="p-3 text-center">
                                  <button
                                    onClick={() => handleEditRekening(item)}
                                    className="p-1.5 rounded-lg text-[#06B6D4] hover:bg-[#06B6D4]/15 transition"
                                    title="Edit Rincian Rekening"
                                  >
                                    <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                      <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path>
                                    </svg>
                                  </button>
                                </td>
                              </tr>
                            );
                          })
                        )}
                      </tbody>
                      <tfoot className="bg-[#041012] border-t-2 border-[#06B6D4]/40 font-bold text-xs">
                        <tr>
                          <td colSpan="5" className="p-3.5 text-right uppercase tracking-wider text-[#A2BBC0]">

                          </td>
                          <td className="p-3.5 text-right text-[#F3FEFF] text-sm">{formatRupiah(tfootBulan.totalJumlah)}</td>
                          <td colSpan="2" className="p-3.5 bg-[#06B6D4]/5 border-x border-[#06B6D4]/20 text-center text-[#A2BBC0] text-[11px] font-normal">
                            Total Realisasi Kas Riil:
                          </td>
                          <td className="p-3.5 text-right text-[#A3E635] text-sm bg-[#06B6D4]/5 border-r border-[#06B6D4]/20">
                            {formatRupiah(tfootBulan.totalRealisasi)}
                          </td>
                          <td className="p-3.5 text-right text-[#06B6D4] text-sm">
                            {formatRupiah(tfootBulan.totalSelisih)}
                          </td>
                          <td colSpan="3" className="p-3.5 text-[#A2BBC0] text-[11px] font-normal">
                            Rekapitulasi pembukuan lembar aktif {activeMonth} TA {tahunAnggaran}
                          </td>
                        </tr>
                      </tfoot>
                    </table>
                  </div>
                </main>

                <section className="bg-[#10282C] border border-[#F43F5E]/30 rounded-2xl p-4 sm:p-5 shadow-2xl">
                  <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3 pb-3 border-b border-[#F43F5E]/20">
                    <div className="flex items-center gap-3">
                      <div className="w-10 h-10 rounded-xl bg-[#F43F5E]/15 text-[#F43F5E] flex items-center justify-center border border-[#F43F5E]/30">
                        <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                          <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path>
                        </svg>
                      </div>
                      <div>
                        <h2 className="text-base font-bold text-[#F3FEFF] flex items-center gap-2">
                          <span>Daftar Rekening Belum Terealisasi / SPJ Belum Lengkap</span>
                          <span className="px-2.5 py-0.5 rounded-full text-xs font-bold bg-[#F43F5E]/20 text-[#F43F5E] border border-[#F43F5E]/40">
                            {pendingItems.length} Rekening
                          </span>
                        </h2>
                        <p className="text-xs text-[#A2BBC0]">
                          Warna label bulan dibedakan secara lembut (soft) dan aman di mata untuk memudahkan identifikasi alokasi belanja.
                        </p>
                      </div>
                    </div>
                  </div>

                  <div className="mt-4 grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3.5">
                    {pendingItems.length === 0 ? (
                      <div className="col-span-full bg-[#041012] border border-[#A3E635]/30 rounded-xl p-6 text-center">
                        <h4 className="text-sm font-bold text-[#A3E635]">Semua Rekening Belanja Telah Terealisasi Lengkap!</h4>
                        <p className="text-xs text-[#A2BBC0] mt-1">Seluruh Tanggal Realisasi, BNU/BPU, Realisasi Belanja, dan SIPLah telah terisi valid.</p>
                      </div>
                    ) : (
                      pendingItems.map(item => {
                        const kekurangan = periksaKekurangan(item);
                        const warnaBln = getWarnaBulan(item.bulan);
                        return (
                          <div key={item.id} className="bg-[#041012] border border-[#F43F5E]/30 hover:border-[#F43F5E]/60 rounded-xl p-4 transition flex flex-col justify-between space-y-3">
                            <div>
                              <div className="flex items-center justify-between gap-2">
                                <span className="px-2.5 py-0.5 rounded-full text-[10px] font-mono font-bold bg-[#06B6D4]/15 text-[#06B6D4] border border-[#06B6D4]/30">
                                  {item.kodeRekening || '-'}
                                </span>
                                <span className={`px-2.5 py-0.5 rounded text-[10px] font-black border ${warnaBln.bg} ${warnaBln.text} ${warnaBln.border}`}>
                                  Bulan {item.bulan}
                                </span>
                              </div>
                              <h4 className="text-xs font-bold text-[#F3FEFF] mt-2 line-clamp-1" title={item.uraian}>
                                {item.uraian || '-'}
                              </h4>
                              <p className="text-[11px] text-[#A2BBC0] line-clamp-2 mt-1">
                                {item.penjelasan || 'Belum ada penjelasan spesifik.'}
                              </p>
                              {item.bulanAsal && item.bulanAsal !== item.bulan && (
                                <div className="mt-1">
                                  <span className="text-[10px] font-bold text-[#A3E635]">
                                    ↳ Berasal dari alokasi Bulan {item.bulanAsal}
                                  </span>
                                </div>
                              )}
                            </div>

                            <div className="space-y-2 border-t border-[#06B6D4]/10 pt-2">
                              <div className="flex justify-between items-center text-[11px]">
                                <span className="text-[#A2BBC0]">Alokasi:</span>
                                <span className="font-bold text-[#F3FEFF]">{formatRupiah(item.jumlah)}</span>
                              </div>
                              <div>
                                <span className="text-[10px] text-[#A2BBC0] block mb-1">Belum Terisi:</span>
                                <div className="flex flex-wrap gap-1">
                                  {kekurangan.map((k, i) => (
                                    <span key={i} className="px-2 py-0.5 rounded text-[10px] font-semibold bg-[#F43F5E]/15 text-[#F43F5E] border border-[#F43F5E]/30">
                                      {k}
                                    </span>
                                  ))}
                                </div>
                              </div>
                              <div className="grid grid-cols-2 gap-2 pt-1">
                                <button
                                  onClick={() => {
                                    setTransferringItem(item);
                                    setTargetTransferMonth(item.bulan);
                                    setIsTransferModalOpen(true);
                                  }}
                                  className="px-2 py-1.5 rounded-lg bg-[#06B6D4]/15 hover:bg-[#06B6D4]/25 text-[#06B6D4] text-xs font-bold border border-[#06B6D4]/30 transition text-center"
                                >
                                  Alihkan Bulan
                                </button>
                                <button
                                  onClick={() => {
                                    setActiveMonth(item.bulan);
                                    tampilkanToast(`Berpindah ke lembar ${item.bulan}.`, "info", "Navigasi Bulan");
                                  }}
                                  className="px-2 py-1.5 rounded-lg bg-[#F43F5E]/15 hover:bg-[#F43F5E]/25 text-[#F43F5E] text-xs font-bold border border-[#F43F5E]/30 transition text-center"
                                >
                                  Buka Lembar
                                </button>
                              </div>
                            </div>
                          </div>
                        );
                      })
                    )}
                  </div>
                </section>

                    <button
                      onClick={() => setIsTransferModalOpen(false)}
                      className="px-4 py-2 rounded-xl bg-[#041012] text-[#A2BBC0] text-xs font-semibold"
                    >
                      Batal
                    </button>
                    <button
                      onClick={() => handleTransferMonth(transferringItem, targetTransferMonth)}
                      className="px-5 py-2 rounded-xl bg-[#06B6D4] text-[#041012] text-xs font-bold"
                    >
                      Konfirmasi Alihkan
                    </button>
                  </div>
                </div>
              </div>
            )}

            {/* MODAL RESET CONFIRM */}
            {isResetConfirmOpen && (
              <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
                <div className="bg-[#10282C] border border-[#F43F5E]/40 rounded-2xl w-full max-w-md p-5 shadow-2xl space-y-4">
                  <h3 className="text-base font-bold text-[#F3FEFF]">Konfirmasi Reset Data</h3>
                  <p className="text-xs text-[#A2BBC0]">
                    Tindakan ini akan mengembalikan data pembukuan ke bawaan awal. Seluruh data yang belum di-backup akan terhapus. Lanjutkan?
                  </p>
                  <div className="flex justify-end gap-3 pt-2">
                    <button onClick={() => setIsResetConfirmOpen(false)} className="px-4 py-2 rounded-xl bg-[#041012] text-[#A2BBC0] text-xs font-semibold">Batal</button>
                    <button onClick={handleResetData} className="px-4 py-2 rounded-xl bg-[#F43F5E] text-white text-xs font-bold">Ya, Reset Data</button>
                  </div>
                </div>
              </div>
            )}

            {/* HIDDEN INPUTS & TOAST NOTIFICATION */}
            <input type="file" ref={fileInputRef} accept=".xlsx, .xls" className="hidden" onChange={handleFileUpload} />
            <input type="file" ref={jsonImportRef} accept=".json" className="hidden" onChange={handleImportBackupJson} />
            <input type="file" ref={fileKegiatanRef} accept=".xlsx, .xls" className="hidden" onChange={handleUploadMasterKegiatan} />
            <input type="file" ref={fileRekeningRef} accept=".xlsx, .xls" className="hidden" onChange={handleUploadMasterRekening} />

            {toast.show && (
              <div className="fixed bottom-5 right-5 z-50 max-w-md bg-[#10282C] border border-[#06B6D4]/50 rounded-xl p-4 shadow-2xl flex items-start gap-3">
                <div className={`mt-0.5 ${toast.type === 'sukses' ? 'text-[#A3E635]' : (toast.type === 'peringatan' ? 'text-[#F43F5E]' : 'text-[#06B6D4]')}`}>
                  ●
                </div>
                <div>
                  <h5 className="text-xs font-bold text-[#F3FEFF]">{toast.title}</h5>
                  <p className="text-xs text-[#A2BBC0] mt-0.5 leading-relaxed">{toast.message}</p>
                </div>
              </div>
            )}

          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
