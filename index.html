<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Realisasi BOSP - SDN 137 Cijerokaso</title>

  <!-- Google Fonts: Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- SheetJS CDN for Excel Export & Import -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

  <!-- React 18 & ReactDOM 18 CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

  <!-- Babel Standalone to compile JSX directly in the browser -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
    }
    input[type="date"]::-webkit-calendar-picker-indicator {
      filter: invert(1) brightness(1.2) drop-shadow(0 0 2px #06B6D4);
      cursor: pointer;
      opacity: 0.95;
      transition: transform 0.15s ease;
    }
    input[type="date"]::-webkit-calendar-picker-indicator:hover {
      transform: scale(1.15);
    }
    .baris-header-abu {
      background-color: #374151 !important;
      color: #E5E7EB !important;
    }
    @media print {
      body {
        background-color: white !important;
        color: black !important;
      }
      header, section, footer, .no-print, button, input, select {
        display: none !important;
      }
      .print-container {
        display: block !important;
        color: black !important;
      }
      .print-container table {
        border-collapse: collapse;
        width: 100%;
        font-size: 9.5pt;
      }
      .print-container th, .print-container td {
        border: 1px solid #333 !important;
        padding: 5px;
      }
      .print-baris-abu {
        background-color: #D1D5DB !important;
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
        font-weight: bold;
      }
    }
  </style>
</head>
<body class="bg-[#041012] text-[#F3FEFF] selection:bg-[#06B6D4] selection:text-[#041012]">

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    const DAFTAR_BULAN = [
      "Januari", "Februari", "Maret", "April", "Mei", "Juni",
      "Juli", "Agustus", "September", "Oktober", "November", "Desember"
    ];

    /* Palet warna lembut (soft, pastel, aman di mata) untuk pembeda tiap bulan */
    const WARNA_BULAN = {
      "Januari":   { bg: "bg-emerald-500/15", text: "text-emerald-300", border: "border-emerald-500/30" }, // Hijau lembut
      "Februari":  { bg: "bg-sky-500/15",     text: "text-sky-300",     border: "border-sky-500/30" },     // Biru lembut
      "Maret":     { bg: "bg-indigo-500/15",  text: "text-indigo-300",  border: "border-indigo-500/30" },  // Nila lembut
      "April":     { bg: "bg-teal-500/15",    text: "text-teal-300",    border: "border-teal-500/30" },    // Toska lembut
      "Mei":       { bg: "bg-rose-500/15",    text: "text-rose-300",    border: "border-rose-500/30" },    // Mawar lembut
      "Juni":      { bg: "bg-amber-500/15",   text: "text-amber-300",   border: "border-amber-500/30" },   // Kuning madu lembut
      "Juli":      { bg: "bg-violet-500/15",  text: "text-violet-300",  border: "border-violet-500/30" },  // Ungu lembut
      "Agustus":   { bg: "bg-cyan-500/15",    text: "text-cyan-300",    border: "border-cyan-500/30" },    // Sian lembut
      "September": { bg: "bg-lime-500/15",    text: "text-lime-300",    border: "border-lime-500/30" },    // Hijau pupus lembut
      "Oktober":   { bg: "bg-orange-500/15",  text: "text-orange-300",  border: "border-orange-500/30" },  // Jingga persik lembut
      "November":  { bg: "bg-fuchsia-500/15", text: "text-fuchsia-300", border: "border-fuchsia-500/30" }, // Fuchsia lembut
      "Desember":  { bg: "bg-slate-400/15",   text: "text-slate-300",   border: "border-slate-400/30" }   // Abu-biru es lembut
    };

    function getWarnaBulan(bulan) {
      return WARNA_BULAN[bulan] || { bg: "bg-[#10282C]", text: "text-[#A3E635]", border: "border-[#06B6D4]/20" };
    }

    const STORAGE_KEY = "sdn137_bosp_records_v3";
    const STORAGE_YEAR_KEY = "sdn137_bosp_year";
    const STORAGE_SELECTED_MONTHS_KEY = "sdn137_bosp_selected_months";
    const STORAGE_COL_WIDTHS_KEY = "sdn137_bosp_col_widths";

    /* Lebar standar kolom tabel (dalam piksel) */
    const DEFAULT_COL_WIDTHS = [
      55,   // 0: No. Urut
      140,  // 1: Kode Rekening
      190,  // 2: Uraian Belanja
      220,  // 3: Penjelasan Uraian
      210,  // 4: Rincian Perhitungan
      130,  // 5: Alokasi (Rp)
      160,  // 6: Tanggal Realisasi
      140,  // 7: BNU / BPU
      160,  // 8: Realisasi Belanja
      130,  // 9: Selisih
      190,  // 10: Nama Toko SIPLah
      210,  // 11: Keterangan SPJ
      85    // 12: Aksi
    ];

    /* Setelan default data kosong sepenuhnya */
    const INITIAL_DATA = [];

    function hasAngkaKodeRekening(kode) {
      if (!kode) return false;
      return /\d/.test(String(kode));
    }

    function formatRupiah(val) {
      const num = Number(val);
      if (isNaN(num)) return "Rp 0";
      const bulat = Math.round(num);
      if (bulat < 0) {
        return "-Rp " + Math.abs(bulat).toLocaleString('id-ID');
      }
      return "Rp " + bulat.toLocaleString('id-ID');
    }

    function cekKelengkapanSpj(item) {
      if (!hasAngkaKodeRekening(item.kodeRekening)) return true;
      const adaJumlah = Number(item.jumlah) > 0;
      const adaTanggal = Boolean(item.tanggalRealisasi && String(item.tanggalRealisasi).trim().length > 0);
      const adaBnu = Boolean(item.bnuBpu && String(item.bnuBpu).trim().length > 0);
      const adaRealisasi = item.realisasiBelanja !== undefined && item.realisasiBelanja !== null && String(item.realisasiBelanja).trim() !== "" && Number(item.realisasiBelanja) > 0;
      const selisih = Number(item.jumlah || 0) - Number(item.realisasiBelanja || 0);
      const adaSelisih = !isNaN(selisih);
      const adaToko = Boolean(item.namaToko && String(item.namaToko).trim().length > 0);

      return adaJumlah && adaTanggal && adaBnu && adaRealisasi && adaSelisih && adaToko;
    }

    function periksaKekurangan(item) {
      const kurang = [];
      if (!item.tanggalRealisasi || String(item.tanggalRealisasi).trim() === "") kurang.push("Tgl Realisasi");
      if (!item.bnuBpu || String(item.bnuBpu).trim() === "") kurang.push("BNU/BPU");
      if (item.realisasiBelanja === undefined || Number(item.realisasiBelanja) <= 0) kurang.push("Realisasi Belanja");
      if (!item.namaToko || String(item.namaToko).trim() === "") kurang.push("Nama Toko SIPLah");
      return kurang;
    }

    function App() {
      const [tahunAnggaran, setTahunAnggaran] = useState(() => {
        try {
          const saved = localStorage.getItem(STORAGE_YEAR_KEY);
          return saved ? Number(saved) : 2026;
        } catch {
          return 2026;
        }
      });

      const [activeMonth, setActiveMonth] = useState("");
      const [selectedMonths, setSelectedMonths] = useState(() => {
        try {
          const saved = localStorage.getItem(STORAGE_SELECTED_MONTHS_KEY);
          if (saved) {
            const parsed = JSON.parse(saved);
            if (Array.isArray(parsed)) return parsed;
          }
        } catch (e) {
          console.warn("Gagal membaca selected months", e);
        }
        return [];
      });

      const [searchTerm, setSearchTerm] = useState("");
      const [statusFilter, setStatusFilter] = useState("all");
      const [showGreyRows, setShowGreyRows] = useState(true);

      /* State untuk mengunci/membuka kunci tab bulan agar tanda silang (✕) tidak terklik tidak sengaja */
      const [isMonthsLocked, setIsMonthsLocked] = useState(() => {
        try {
          const saved = localStorage.getItem("sdn137_bosp_months_locked");
          return saved !== null ? JSON.parse(saved) : true; // Bawaan default selalu terkunci demi keamanan data
        } catch {
          return true;
        }
      });

      useEffect(() => {
        try {
          localStorage.setItem("sdn137_bosp_months_locked", JSON.stringify(isMonthsLocked));
        } catch (e) {}
      }, [isMonthsLocked]);

      /* State lebar kolom tabel yang fleksibel dan dapat digeser */
      const [colWidths, setColWidths] = useState(() => {
        try {
          const saved = localStorage.getItem(STORAGE_COL_WIDTHS_KEY);
          if (saved) {
            const parsed = JSON.parse(saved);
            if (Array.isArray(parsed) && parsed.length === DEFAULT_COL_WIDTHS.length) {
              return parsed;
            }
          }
        } catch (e) {
          console.warn("Gagal membaca colWidths", e);
        }
        return DEFAULT_COL_WIDTHS;
      });

      const [resizingCol, setResizingCol] = useState(null);
      const resizeInfoRef = useRef(null);

      useEffect(() => {
        try {
          localStorage.setItem(STORAGE_COL_WIDTHS_KEY, JSON.stringify(colWidths));
        } catch (e) {}
      }, [colWidths]);

      const startResizing = (colIdx, clientX) => {
        resizeInfoRef.current = {
          colIdx,
          startX: clientX,
          startWidth: colWidths[colIdx]
        };
        setResizingCol(colIdx);
      };

      useEffect(() => {
        if (resizingCol === null) return;

        const handleMove = (e) => {
          if (!resizeInfoRef.current) return;
          const clientX = e.touches ? e.touches[0].clientX : e.clientX;
          const deltaX = clientX - resizeInfoRef.current.startX;
          const newWidth = Math.max(45, Math.round(resizeInfoRef.current.startWidth + deltaX));

          setColWidths(prev => {
            const next = [...prev];
            next[resizeInfoRef.current.colIdx] = newWidth;
            return next;
          });
        };

        const handleEnd = () => {
          setResizingCol(null);
          resizeInfoRef.current = null;
        };

        document.body.style.userSelect = 'none';
        document.body.style.cursor = 'col-resize';

        window.addEventListener('mousemove', handleMove);
        window.addEventListener('mouseup', handleEnd);
        window.addEventListener('touchmove', handleMove, { passive: false });
        window.addEventListener('touchend', handleEnd);

        return () => {
          document.body.style.userSelect = '';
          document.body.style.cursor = '';
          window.removeEventListener('mousemove', handleMove);
          window.removeEventListener('mouseup', handleEnd);
          window.removeEventListener('touchmove', handleMove);
          window.removeEventListener('touchend', handleEnd);
        };
      }, [resizingCol]);

      const totalTableWidth = useMemo(() => {
        return colWidths.reduce((acc, w) => acc + w, 0);
      }, [colWidths]);

      const handleResetColWidths = () => {
        setColWidths(DEFAULT_COL_WIDTHS);
        tampilkanToast("Lebar kolom tabel dikembalikan ke ukuran standar.", "info", "Ukuran Kolom Direset");
      };

      const renderResizer = (colIndex) => (
        <div
          onMouseDown={(e) => {
            e.preventDefault();
            e.stopPropagation();
            startResizing(colIndex, e.clientX);
          }}
          onTouchStart={(e) => {
            if (e.touches && e.touches[0]) {
              startResizing(colIndex, e.touches[0].clientX);
            }
          }}
          onDoubleClick={(e) => {
            e.preventDefault();
            e.stopPropagation();
            setColWidths(prev => {
              const next = [...prev];
              next[colIndex] = DEFAULT_COL_WIDTHS[colIndex];
              return next;
            });
          }}
          className={`absolute top-0 right-0 h-full w-2.5 cursor-col-resize z-20 transition-colors flex items-center justify-center select-none hover:bg-[#06B6D4] ${
            resizingCol === colIndex ? 'bg-[#06B6D4] opacity-100' : 'opacity-40 hover:opacity-100'
          }`}
          title="Tarik / geser garis ini untuk mengubah lebar kolom (Klik 2x untuk reset)"
        >
          <div className="w-[1px] h-3.5 bg-[#06B6D4]/70"></div>
        </div>
      );

      const [items, setItems] = useState(() => {
        try {
          const saved = localStorage.getItem(STORAGE_KEY);
          if (saved) {
            const parsed = JSON.parse(saved);
            if (Array.isArray(parsed)) return parsed;
          }
        } catch (e) {
          console.warn("Gagal membaca dari localStorage", e);
        }
        return INITIAL_DATA;
      });

      const [isMonthModalOpen, setIsMonthModalOpen] = useState(false);
      const [isRekeningModalOpen, setIsRekeningModalOpen] = useState(false);
      const [isResetConfirmOpen, setIsResetConfirmOpen] = useState(false);
      const [resetStep, setResetStep] = useState(1);
      const [editingItem, setEditingItem] = useState(null);
      const [toast, setToast] = useState({ show: false, message: "", type: "info", title: "" });
      const [targetUploadMonth, setTargetUploadMonth] = useState("Januari");

      /* State untuk Modal Alihkan Realisasi Bulan */
      const [isMoveModalOpen, setIsMoveModalOpen] = useState(false);
      const [movingItem, setMovingItem] = useState(null);
      const [targetMoveMonth, setTargetMoveMonth] = useState("");

      const [formState, setFormState] = useState({
        bulan: "Januari",
        kodeRekening: "",
        uraian: "",
        penjelasan: "",
        volume: 1,
        satuan: "Paket",
        tarifHarga: 0
      });

      const fileInputRef = useRef(null);
      const jsonImportRef = useRef(null);

      const [lastSaved, setLastSaved] = useState(() => {
        try {
          return localStorage.getItem("sdn137_bosp_last_saved") || "";
        } catch {
          return "";
        }
      });

      useEffect(() => {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(items));
          localStorage.setItem(STORAGE_YEAR_KEY, String(tahunAnggaran));
          localStorage.setItem(STORAGE_SELECTED_MONTHS_KEY, JSON.stringify(selectedMonths));
        } catch (err) {
          console.error("Gagal menyimpan ke localStorage", err);
        }
      }, [items, tahunAnggaran, selectedMonths]);

      const tampilkanToast = (message, type = "info", title = "Pemberitahuan") => {
        setToast({ show: true, message, type, title });
        setTimeout(() => {
          setToast(prev => ({ ...prev, show: false }));
        }, 4000);
      };

      const handleSimpanProgres = () => {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(items));
          localStorage.setItem(STORAGE_YEAR_KEY, String(tahunAnggaran));
          localStorage.setItem(STORAGE_SELECTED_MONTHS_KEY, JSON.stringify(selectedMonths));
          const nowStr = new Date().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
          localStorage.setItem("sdn137_bosp_last_saved", nowStr);
          setLastSaved(nowStr);
          tampilkanToast(
            `Seluruh data progres pembukuan TA ${tahunAnggaran} (${items.length} rekening) berhasil disimpan ke memori browser.`,
            "sukses",
            "Progres Berhasil Disimpan"
          );
        } catch (err) {
          console.error(err);
          tampilkanToast("Gagal menyimpan data progres ke penyimpanan lokal browser.", "peringatan", "Gagal Menyimpan");
        }
      };

      const itemsTahun = useMemo(() => {
        return items.filter(it => !it.tahun || Number(it.tahun) === Number(tahunAnggaran));
      }, [items, tahunAnggaran]);

      const daftarBulanAktif = useMemo(() => {
        const bulanDariData = itemsTahun.map(it => it.bulan);
        const setBulan = new Set([...selectedMonths, ...bulanDariData, ...(activeMonth ? [activeMonth] : [])]);
        return DAFTAR_BULAN.filter(b => setBulan.has(b));
      }, [selectedMonths, itemsTahun, activeMonth]);

      useEffect(() => {
        if (!activeMonth && daftarBulanAktif.length > 0) {
          setActiveMonth(daftarBulanAktif[0]);
        }
      }, [daftarBulanAktif, activeMonth]);

      const itemsBulan = useMemo(() => {
        if (!activeMonth) return [];
        return itemsTahun.filter(it => it.bulan === activeMonth);
      }, [itemsTahun, activeMonth]);

      const filteredItemsBulan = useMemo(() => {
        return itemsBulan.filter(item => {
          const hasKode = hasAngkaKodeRekening(item.kodeRekening);
          if (!showGreyRows && !hasKode) {
            return false;
          }

          const cocokSearch =
            searchTerm.trim() === "" ||
            (item.kodeRekening && item.kodeRekening.toLowerCase().includes(searchTerm.toLowerCase())) ||
            (item.uraian && item.uraian.toLowerCase().includes(searchTerm.toLowerCase())) ||
            (item.penjelasan && item.penjelasan.toLowerCase().includes(searchTerm.toLowerCase())) ||
            (item.namaToko && item.namaToko.toLowerCase().includes(searchTerm.toLowerCase())) ||
            (item.bnuBpu && item.bnuBpu.toLowerCase().includes(searchTerm.toLowerCase()));

          const isLengkap = cekKelengkapanSpj(item);
          if (statusFilter === "lengkap") return cocokSearch && isLengkap;
          if (statusFilter === "belum") return cocokSearch && !isLengkap;
          return cocokSearch;
        });
      }, [itemsBulan, searchTerm, statusFilter, showGreyRows]);

      const stats = useMemo(() => {
        let totalAlokasi = 0;
        let totalRealisasi = 0;
        let lengkapCount = 0;
        let countRekeningTransaksi = 0;

        itemsTahun.forEach(it => {
          if (!hasAngkaKodeRekening(it.kodeRekening)) return;
          countRekeningTransaksi++;
          const j = Number(it.jumlah) || 0;
          const r = Number(it.realisasiBelanja) || 0;
          totalAlokasi += j;
          totalRealisasi += r;
          if (cekKelengkapanSpj(it)) lengkapCount++;
        });

        const totalSelisih = totalAlokasi - totalRealisasi;
        const persenRealisasi = totalAlokasi > 0 ? Math.min(100, Math.round((totalRealisasi / totalAlokasi) * 100)) : 0;
        const persenSpj = countRekeningTransaksi > 0 ? Math.round((lengkapCount / countRekeningTransaksi) * 100) : 0;

        return {
          totalAlokasi,
          totalRealisasi,
          totalSelisih,
          lengkapCount,
          countTotal: countRekeningTransaksi,
          countBelum: countRekeningTransaksi - lengkapCount,
          persenRealisasi,
          persenSpj
        };
      }, [itemsTahun]);

      const tfootBulan = useMemo(() => {
        let totalJumlah = 0;
        let totalRealisasi = 0;
        itemsBulan.forEach(it => {
          if (!hasAngkaKodeRekening(it.kodeRekening)) return;
          totalJumlah += Number(it.jumlah) || 0;
          totalRealisasi += Number(it.realisasiBelanja) || 0;
        });
        return {
          totalJumlah,
          totalRealisasi,
          totalSelisih: totalJumlah - totalRealisasi
        };
      }, [itemsBulan]);

      const pendingItems = useMemo(() => {
        return itemsTahun.filter(it => hasAngkaKodeRekening(it.kodeRekening) && !cekKelengkapanSpj(it));
      }, [itemsTahun]);

      const handleInlineUpdate = (id, field, value) => {
        setItems(prevItems => prevItems.map(it => {
          if (it.id === id) {
            return {
              ...it,
              [field]: field === 'realisasiBelanja' ? (parseFloat(value) || 0) : value
            };
          }
          return it;
        }));
      };

      const handleOpenNewRekening = () => {
        if (!activeMonth && daftarBulanAktif.length === 0) {
          tampilkanToast("Silakan buat atau pilih tabel realisasi bulan terlebih dahulu.", "peringatan", "Bulan Belum Ada");
          setIsMonthModalOpen(true);
          return;
        }
        const defaultBln = activeMonth || daftarBulanAktif[0] || "Januari";
        setEditingItem(null);
        setFormState({
          bulan: defaultBln,
          kodeRekening: "",
          uraian: "",
          penjelasan: "",
          volume: 1,
          satuan: "Paket",
          tarifHarga: 0
        });
        setIsRekeningModalOpen(true);
      };

      /* Fungsi untuk membuka dialog pengalihan realisasi ke bulan lain */
      const handleOpenMoveMonth = (item) => {
        setMovingItem(item);
        const kandidat = DAFTAR_BULAN.filter(b => b !== item.bulan);
        setTargetMoveMonth(kandidat[0] || "Januari");
        setIsMoveModalOpen(true);
      };

      /* Fungsi eksekusi pengalihan realisasi dari Bulan A ke Bulan B */
      const handleExecuteMoveMonth = (e) => {
        e.preventDefault();
        if (!movingItem || !targetMoveMonth) return;

        const bulanAsal = movingItem.bulanAsal || movingItem.bulan;

        setItems(prev => prev.map(it => {
          if (it.id === movingItem.id) {
            return {
              ...it,
              bulan: targetMoveMonth,
              bulanAsal: bulanAsal !== targetMoveMonth ? bulanAsal : ""
            };
          }
          return it;
        }));

        setSelectedMonths(prev => prev.includes(targetMoveMonth) ? prev : [...prev, targetMoveMonth]);
        setActiveMonth(targetMoveMonth);
        setIsMoveModalOpen(false);
        tampilkanToast(
          `Rekening dialihkan ke bulan ${targetMoveMonth}. Keterangan asal dari bulan ${bulanAsal} telah ditambahkan.`,
          "sukses",
          "Realisasi Dialihkan"
        );
      };

      const handleEditRekening = (item) => {
        setEditingItem(item);
        setFormState({
          bulan: item.bulan || activeMonth,
          kodeRekening: item.kodeRekening || "",
          uraian: item.uraian || "",
          penjelasan: item.penjelasan || "",
          volume: item.volume || 1,
          satuan: item.satuan || "Paket",
          tarifHarga: item.tarifHarga || 0
        });
        setIsRekeningModalOpen(true);
      };

      const handleDeleteRekening = (id, kode) => {
        setItems(prev => prev.filter(it => it.id !== id));
        tampilkanToast(`Rekening ${kode || ''} berhasil dihapus.`, "peringatan", "Rekening Dihapus");
      };

      const handleDeleteBulan = (bulan) => {
        const updatedSelected = selectedMonths.filter(b => b !== bulan);
        setSelectedMonths(updatedSelected);
        setItems(prev => prev.filter(it => !(it.bulan === bulan && (!it.tahun || Number(it.tahun) === Number(tahunAnggaran)))));

        if (activeMonth === bulan) {
          const sisaBulan = DAFTAR_BULAN.filter(b => updatedSelected.includes(b) && b !== bulan);
          setActiveMonth(sisaBulan.length > 0 ? sisaBulan[0] : "");
        }

        tampilkanToast(`Tabel realisasi bulan ${bulan} berhasil dihapus dari panel.`, "peringatan", "Bulan Dihapus");
      };

      const handleSaveRekening = (e) => {
        e.preventDefault();
        const isHeader = !hasAngkaKodeRekening(formState.kodeRekening);

                it.tarifHarga || 0,

                it.bnuBpu || "",
                r,

                it.namaToko || "",

            }

        }

        const fileName = `Realisasi_BOSP_SDN137_${namaBulan}_${tahunAnggaran}.xlsx`;

        try {
          if (window.XLSX) {
            const wb = window.XLSX.utils.book_new();
            const ws = window.XLSX.utils.aoa_to_sheet(rows);
            ws['!cols'] = [
              { wch: 8 }, { wch: 22 }, { wch: 30 }, { wch: 35 }, { wch: 10 },
              { wch: 12 }, { wch: 16 }, { wch: 18 }, { wch: 16 }, { wch: 20 },
              { wch: 20 }, { wch: 16 }, { wch: 28 }, { wch: 28 }

            window.XLSX.utils.book_append_sheet(wb, ws, `Realisasi ${namaBulan}`);
            window.XLSX.writeFile(wb, fileName);
            tampilkanToast(`Berkas Excel ${fileName} berhasil diunduh.`, "sukses", "Download Berhasil");
          } else {
            tampilkanToast("Pustaka SheetJS sedang disiapkan, silakan coba lagi.", "info");
          }

          console.error(e);
          tampilkanToast("Gagal mengunduh lembar Excel.", "peringatan");

            "Satuan", "Tarif Harga (Rp)", "Jumlah (Rp)", "Tanggal Realisasi",

            dataBulan.forEach((it, idx) => {

          try {
            if (!window.XLSX) throw new Error("Pustaka SheetJS belum siap.");
            const data = new Uint8Array(evt.target.result);
            const workbook = window.XLSX.read(data, { type: 'array' });
            const sheet = workbook.Sheets[workbook.SheetNames[0]];
            const rows = window.XLSX.utils.sheet_to_json(sheet, { header: 1 });

            if (!rows || rows.length < 2) {
              tampilkanToast("Berkas Excel tidak memiliki baris data yang valid.", "peringatan");
              return;
            }

            const newItems = [];
            for (let i = 1; i < rows.length; i++) {
              const r = rows[i];
              if (!r || (!r[1] && !r[2])) continue;

              const kode = String(r[1] || "").trim();
              const isHeader = !hasAngkaKodeRekening(kode);

              const volume = isHeader ? 0 : (parseFloat(r[4]) || 1);
              const tarif = isHeader ? 0 : (parseFloat(r[6]) || 0);
              const jumlah = isHeader ? 0 : ((volume * tarif) > 0 ? (volume * tarif) : (parseFloat(r[7]) || 0));

              let tanggal = String(r[8] || "").trim();
              if (typeof r[8] === 'number') {
                const dateObj = new Date(Math.round((r[8] - 25569) * 86400 * 1000));
                tanggal = dateObj.toISOString().split('T')[0];
              }

              newItems.push({
                id: `bosp_up_${Date.now()}_${i}`,
                tahun: tahunAnggaran,
                bulan: targetUploadMonth,
                kodeRekening: kode,
                uraian: String(r[2] || "").trim(),
                penjelasan: String(r[3] || "").trim(),
                volume,
                satuan: isHeader ? "" : String(r[5] || "Paket").trim(),
                tarifHarga: tarif,
                jumlah,
                tanggalRealisasi: isHeader ? "" : tanggal,
                bnuBpu: isHeader ? "" : String(r[9] || "").trim(),
                realisasiBelanja: isHeader ? 0 : (parseFloat(r[10]) || 0),
                namaToko: isHeader ? "" : String(r[12] || "").trim()
              });
            }

            if (newItems.length > 0) {
              setItems(prev => [...prev, ...newItems]);
              setActiveMonth(targetUploadMonth);
              setSelectedMonths(prev => prev.includes(targetUploadMonth) ? prev : [...prev, targetUploadMonth]);
              setIsMonthModalOpen(false);
              tampilkanToast(`${newItems.length} baris berhasil diimpor ke bulan ${targetUploadMonth}.`, "sukses", "Impor Berhasil");
            }
          } catch (err) {
            console.error(err);
            tampilkanToast("Gagal membaca berkas Excel. Pastikan format kolom sesuai standar.", "peringatan");
          }
        };
        reader.readAsArrayBuffer(file);
      };

                            >
                              <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 9v3m0 0v3m0-3h3m-3-3H9m12 0a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                              </svg>

                            </button>

                    ) : filteredItemsBulan.length === 0 ? (
                      <tr>
                        <td colSpan="13" className="text-center py-14 text-[#A2BBC0]">
                          <div className="max-w-md mx-auto space-y-2">
                            <div className="w-10 h-10 mx-auto rounded-full bg-[#041012] border border-[#06B6D4]/30 flex items-center justify-center text-[#06B6D4]">

                                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M20 13V6a2 2 0 00-2-2H6a2 2 0 00-2 2v7m16 0v5a2 2 0 01-2 2H6a2 2 0 01-2-2v-5m16 0h-2.586a1 1 0 00-.707.293l-2.414 2.414a1 1 0 01-.707.293h-3.172a1 1 0 01-.707-.293l-2.414-2.414A1 1 0 006.586 13H4"></path>
                              </svg>
                            </div>
                            <p className="font-semibold text-sm text-[#F3FEFF]">Tidak ada rekening belanja yang ditemukan.</p>
                            <p className="text-xs text-[#A2BBC0]">
                              {searchTerm || statusFilter !== "all" 
                                ? "Coba atur ulang kata kunci pencarian atau filter status." 
                                : `Bulan ${activeMonth} belum memiliki rekening. Klik tombol "+ Tambah Rekening" untuk memasukkan data.`}
                            </p>
                          </div>
                        </td>
                      </tr>
                    ) : (
                      filteredItemsBulan.map((item, index) => {
                        const hasKode = hasAngkaKodeRekening(item.kodeRekening);
                        const j = Number(item.jumlah) || 0;
                        const r = Number(item.realisasiBelanja) || 0;
                        const selisih = j - r;
                        const isLengkap = cekKelengkapanSpj(item);

                        if (!hasKode) {
                          return (
                            <tr
                              key={item.id}
                              className="bg-[#374151] hover:bg-[#4B5563] text-gray-200 border-y border-gray-600 transition font-medium cursor-pointer"

                              title="Baris Kategori / Judul tanpa kode rekening (Klik untuk edit/hapus)"
                            >
                              <td className="p-3 text-center font-bold text-gray-400">{index + 1}</td>
                              <td className="p-3 font-mono text-gray-300 italic">{item.kodeRekening || '-'}</td>
                              <td className="p-3 font-bold text-white uppercase tracking-wide">{item.uraian || '-'}</td>
                              <td className="p-3 text-gray-300 text-[11px] leading-relaxed">{item.penjelasan || ''}</td>
                              <td className="p-3 text-center"></td>
                              <td className="p-3 text-right"></td>
                              <td className="p-2 border-x border-gray-600/40"></td>
                              <td className="p-2 border-r border-gray-600/40"></td>
                              <td className="p-2 border-r border-gray-600/40"></td>
                              <td className="p-3 text-right"></td>

                              <td className="p-3"></td>

                                  type="button"

                                  title="Sembunyikan baris abu-abu ini"

                            </tr>

                            <td className="p-3 font-mono font-bold text-[#06B6D4]">{item.kodeRekening || '-'}</td>

                            <td className="p-3 text-right font-bold text-[#F3FEFF]">{formatRupiah(j)}</td>

                              <input
                                type="text"
                                value={item.bnuBpu || ''}

                              />
                            </td>

                            {/* 3. REALISASI BELANJA */}
                            <td className="p-2 bg-[#06B6D4]/5 border-r border-[#06B6D4]/20">
                              <input
                                type="number"
                                step="any"
                                min="0"

                              />
                            </td>

                            {/* SELISIH */}
                            <td className={`p-3 text-right font-bold ${selisih > 0 ? 'text-[#06B6D4]' : (selisih < 0 ? 'text-[#F43F5E]' : 'text-[#A2BBC0]')}`}>
                              {formatRupiah(selisih)}
                            </td>

                            {/* 4. NAMA TOKO SIPLAH */}
                            <td className="p-2 bg-[#06B6D4]/5 border-x border-[#06B6D4]/20">
                              <input
                                type="text"
                                value={item.namaToko || ''}
                                placeholder="Penyedia SIPLah / Rekanan..."
                                onChange={(e) => handleInlineUpdate(item.id, 'namaToko', e.target.value)}

                                      </svg>
                                      Realisasi Alihan dr Bulan {item.bulanAsal}
                                    </span>
                                  </div>
                                )}
                              </div>
                            </td>

                            {/* TOMBOL AKSI */}
                            <td className="p-3 text-center">
                              <div className="flex items-center justify-center gap-1">
                                <button
                                  onClick={() => handleEditRekening(item)}

                                  title="Edit Rincian Rekening"

                                  </svg>
                                </button>

                                  <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">

                                  </svg>
                                </button>
                              </div>
                            </td>
                          </tr>
                        );
                      })
                    )}
                  </tbody>

                  <tfoot className="bg-[#041012] border-t-2 border-[#06B6D4]/40 font-bold text-xs">
                    <tr>
                      <td colSpan="5" className="p-3.5 text-right uppercase tracking-wider text-[#A2BBC0]">

                      <td colSpan="2" className="p-3.5 bg-[#06B6D4]/5 border-x border-[#06B6D4]/20 text-center text-[#A2BBC0] text-[11px] font-normal">

                    </tr>
                  </tfoot>
                </table>
              </div>

                        {pendingItems.length} Rekening

                            <span className={`px-2.5 py-0.5 rounded text-[10px] font-bold border transition-colors ${warnaBulan.bg} ${warnaBulan.text} ${warnaBulan.border}`}>

                          <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path>
                        </svg>
                      </div>
                      <div>
                        <h3 className="text-lg font-bold text-[#F3FEFF]">Pembuatan & Pilihan Tabel Realisasi Baru</h3>
                        <p className="text-xs text-[#A2BBC0]">Pilih bulan anggaran (Januari – Desember) untuk membuka lembar kerja atau unduh/unggah berkas Excel (.xlsx)</p>

                    <>
                      <div className="bg-[#041012] p-3.5 rounded-xl border border-[#F43F5E]/30 space-y-2">
                        <p className="text-xs text-[#F43F5E] leading-relaxed font-bold flex items-start gap-1.5">
                          <svg className="w-4 h-4 text-[#F43F5E] flex-shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path>
                          </svg>
                          <span>Sebelum benar-benar direset sebaiknya lakukan backup.</span>
                        </p>
                        <p className="text-[11px] text-[#A2BBC0]">
                          Apakah Anda ingin mencadangkan berkas JSON terlebih dahulu sebelum seluruh data dikosongkan?
                        </p>
                      </div>
                      <div className="flex flex-wrap items-center justify-between gap-2 pt-2">
                        <button
                          onClick={() => handleExportBackupJson()}
                          className="px-3.5 py-2 rounded-xl bg-[#06B6D4]/15 hover:bg-[#06B6D4]/25 text-[#06B6D4] text-xs font-bold border border-[#06B6D4]/30 transition flex items-center gap-1.5"
                          title="Unduh cadangan data sekarang"
                        >
                          <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M8 7H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-3m-1 4l-3 3m0 0l-3-3m3 3V4"></path>
                          </svg>
                          <span>Backup Sekarang</span>
                        </button>

                        <div className="flex items-center gap-2">
                          <button
                            onClick={() => {
                              setIsResetConfirmOpen(false);
                              setResetStep(1);
                            }}
                            className="px-3.5 py-2 rounded-xl bg-[#041012] text-[#A2BBC0] hover:text-[#F3FEFF] text-xs font-semibold border border-[#06B6D4]/20 transition"
                          >
                            Batal
                          </button>
                          <button
                            onClick={handleResetData}
                            className="px-4 py-2 rounded-xl bg-[#F43F5E] text-white text-xs font-bold hover:bg-rose-600 transition shadow-lg shadow-[#F43F5E]/25"
                          >
                            Ya, Reset Data
                          </button>
                        </div>
                      </div>
                    </>
                  )}
                </div>
              </div>
            )}

            <input
              type="file"
              ref={fileInputRef}
              accept=".xlsx, .xls"
              className="hidden"
              onChange={handleFileUpload}
            />
            <input
              type="file"
              ref={jsonImportRef}
              accept=".json"
              className="hidden"
              onChange={handleImportBackupJson}
            />

            {toast.show && (
              <div className="fixed bottom-5 right-5 z-50 max-w-md bg-[#10282C] border border-[#06B6D4]/50 rounded-xl p-4 shadow-2xl flex items-start gap-3">
                <div className={`mt-0.5 ${toast.type === 'sukses' ? 'text-[#A3E635]' : (toast.type === 'peringatan' ? 'text-[#F43F5E]' : 'text-[#06B6D4]')}`}>
                  {toast.type === 'sukses' ? (
                    <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M5 13l4 4L19 7"></path>
                    </svg>
                  ) : (
                    <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                    </svg>
                  )}
                </div>
                <div>
                  <h5 className="text-xs font-bold text-[#F3FEFF]">{toast.title}</h5>
                  <p className="text-xs text-[#A2BBC0] mt-0.5 leading-relaxed">{toast.message}</p>
                </div>
              </div>
            )}

            <div className="hidden print-container p-6 bg-white text-black font-serif">
              <div className="text-center border-b-2 border-black pb-4 mb-4">
                <h2 className="text-xl font-bold uppercase">PEMERINTAH KOTA BANDUNG</h2>
                <h3 className="text-lg font-bold uppercase">DINAS PENDIDIKAN</h3>
                <h1 className="text-2xl font-black uppercase">SD NEGERI 137 CIJEROKASO</h1>
                <p className="text-xs italic">Jl. Cijerokaso No. 137, Sarijadi, Kec. Sukasari, Kota Bandung, Jawa Barat</p>
                <h4 className="text-sm font-bold mt-2 uppercase underline">
                  LEMBAR REKONSILIASI & REALISASI BELANJA BOSP — BULAN {activeMonth ? activeMonth.toUpperCase() : "..."} {tahunAnggaran}
                </h4>
              </div>

              <table className="w-full text-xs mb-8">
                <thead>
                  <tr className="bg-gray-200">
                    <th className="p-1">No</th>
                    <th className="p-1">Kode Rekening</th>
                    <th className="p-1">Uraian Rekening</th>
                    <th className="p-1">Vol</th>
                    <th className="p-1">Satuan</th>
                    <th className="p-1">Alokasi (Rp)</th>
                    <th className="p-1">Tgl Realisasi</th>
                    <th className="p-1">No. BNU/BPU</th>
                    <th className="p-1">Realisasi (Rp)</th>
                    <th className="p-1">Selisih (Rp)</th>
                    <th className="p-1">Toko SIPLah</th>
                    <th className="p-1">Keterangan</th>
                  </tr>
                </thead>
                <tbody>
                  {itemsBulan.map((it, idx) => {
                    const hasKode = hasAngkaKodeRekening(it.kodeRekening);
                    if (!hasKode) {
                      return (
                        <tr key={it.id} className="print-baris-abu">
                          <td className="text-center font-bold">{idx + 1}</td>
                          <td className="font-mono">{it.kodeRekening || '-'}</td>
                          <td className="font-bold uppercase" colSpan="10">{it.uraian}</td>
                        </tr>
                      );
                    }
                    const j = Number(it.jumlah) || 0;
                    const r = Number(it.realisasiBelanja) || 0;
                    return (
                      <tr key={it.id}>
                        <td className="text-center">{idx + 1}</td>
                        <td className="font-mono">{it.kodeRekening}</td>
                        <td>{it.uraian}</td>
                        <td className="text-center">{it.volume}</td>
                        <td className="text-center">{it.satuan}</td>
                        <td className="text-right">{formatRupiah(j)}</td>
                        <td className="text-center">{it.tanggalRealisasi || '-'}</td>
                        <td className="text-center">{it.bnuBpu || '-'}</td>
                        <td className="text-right">{formatRupiah(r)}</td>
                        <td className="text-right">{formatRupiah(j - r)}</td>
                        <td>{it.namaToko || '-'}</td>
                        <td className="text-center">{cekKelengkapanSpj(it) ? "LENGKAP" : "BELUM LENGKAP"}</td>
                      </tr>
                    );
                  })}
                </tbody>
                <tfoot>
                  <tr className="font-bold bg-gray-100">
                    <td colSpan="5" className="text-right p-2">JUMLAH TOTAL:</td>
                    <td className="text-right p-2">{formatRupiah(tfootBulan.totalJumlah)}</td>
                    <td colSpan="2"></td>
                    <td className="text-right p-2">{formatRupiah(tfootBulan.totalRealisasi)}</td>
                    <td className="text-right p-2">{formatRupiah(tfootBulan.totalSelisih)}</td>
                    <td colSpan="2"></td>
                  </tr>
                </tfoot>
              </table>

              <div className="grid grid-cols-2 text-center text-xs mt-12 pt-8">
                <div>
                  <p>Mengetahui,</p>
                  <p className="font-bold">Kepala SDN 137 Cijerokaso</p>
                  <div className="h-20"></div>
                  <p className="font-bold underline">_____________________________</p>
                  <p>NIP. .....................................................</p>
                </div>
                <div>
                  <p>Bandung, {new Date().toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric' })}</p>
                  <p className="font-bold">Bendahara BOSP</p>
                  <div className="h-20"></div>
                  <p className="font-bold underline">_____________________________</p>
                  <p>NIP. .....................................................</p>
                </div>
              </div>
            </div>

          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
